<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sri Lanka Softball - Ultimate Broadcast & Tournament Suite</title>
    <!-- React & Tailwind CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .broadcast-canvas { aspect-ratio: 16/9; background: #000; position: relative; overflow: hidden; border: 2px solid #1f2937; }
        .clip-diagonal { clip-path: polygon(0 0, 92% 0, 100% 100%, 0% 100%); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Default 26 Broadcast Scenes (Module 2)
        const DEFAULT_SCENES = [
            "Welcome", "Tournament Intro", "Ground Intro", "Team A Intro", "Team B Intro", 
            "Both Teams", "Toss", "Playing XI", "Main Scoreboard", "Batsman", "Bowler", 
            "Wicket", "Four", "Six", "Fifty", "Century", "Partnership", "Current Over", 
            "Target", "Drinks Break", "Innings Break", "Second Innings", "Match Summary", 
            "Match Result", "Player of Match", "Emergency / Technical Break"
        ];

        // Dynamic Cricket Fields (Module 4)
        const DYNAMIC_FIELDS = [
            "{{TOURNAMENT_NAME}}", "{{MATCH_NAME}}", "{{MATCH_NUMBER}}",
            "{{TEAM_A_NAME}}", "{{TEAM_A_SCORE}}", "{{TEAM_A_WICKETS}}", "{{TEAM_A_OVERS}}",
            "{{TEAM_B_NAME}}", "{{TEAM_B_SCORE}}", "{{TEAM_B_WICKETS}}", "{{TEAM_B_OVERS}}",
            "{{BATSMAN_1_NAME}}", "{{BATSMAN_1_RUNS}}", "{{BATSMAN_1_BALLS}}",
            "{{BOWLER_NAME}}", "{{BOWLER_OVERS}}", "{{BOWLER_WICKETS}}", "{{BOWLER_RUNS}}",
            "{{PARTNERSHIP}}", "{{TARGET}}", "{{RUNS_NEEDED}}", "{{BALLS_REMAINING}}", "{{CURRENT_OVER}}"
        ];

        function App() {
            // Navigation: 'home', 'dashboard', 'scoring', 'editor', 'obs'
            const [currentView, setCurrentView] = useState('home');
            const [activeDashboardTab, setActiveDashboardTab] = useState('matches'); // matches, teams, table, stats, info, editor
            const [editorSubTab, setEditorSubTab] = useState('canvas'); // canvas, controlRoom, media, sponsors, audio, watermark, version

            // Tournament State
            const [tournaments, setTournaments] = useState([
                { id: 'SLS-2026', name: 'Sri Lanka Premier Softball Cup 2026', type: 'League', teamsCount: 8, status: 'Live', obsLink: 'https://srilankasoftball.com/live/tournament/SLS-2026' }
            ]);
            const [currentTournament, setCurrentTournament] = useState(tournaments[0]);

            // Teams & Players State
            const [teams, setTeams] = useState([
                { id: 1, name: 'EAGLES', short: 'EAG', group: 'Group A', color: '#ef4444', playersCount: 12 },
                { id: 2, name: 'WARRIORS', short: 'WAR', group: 'Group A', color: '#3b82f6', playersCount: 12 },
                { id: 3, name: 'STRIKERS', short: 'STR', group: 'Group B', color: '#10b981', playersCount: 12 },
                { id: 4, name: 'ROYALS', short: 'ROY', group: 'Group B', color: '#f59e0b', playersCount: 12 }
            ]);
            const [selectedTeam, setSelectedTeam] = useState(teams[0]);

            // Players State
            const [players, setPlayers] = useState([
                { id: 1, teamId: 1, name: 'Sasindu Ashen', role: 'Batsman', jersey: 7, runs: 142, wickets: 2 },
                { id: 2, teamId: 1, name: 'Bd Lakshan', role: 'All-Rounder', jersey: 10, runs: 95, wickets: 8 },
                { id: 3, teamId: 2, name: 'Thanush V', role: 'Bowler', jersey: 23, runs: 24, wickets: 14 }
            ]);

            // Match Live State & History (Undo System - Module 24)
            const [match, setMatch] = useState({
                matchNo: 1,
                teamA: { name: 'EAGLES', score: 84, wickets: 3, overs: 4.2 },
                teamB: { name: 'WARRIORS', score: 0, wickets: 0, overs: 0.0 },
                striker: { name: 'Sasindu Ashen', runs: 34, balls: 14, fours: 3, sixes: 2 },
                nonStriker: { name: 'Bd Lakshan', runs: 12, balls: 8, fours: 1, sixes: 0 },
                bowler: { name: 'Thanush V', overs: 0.2, runs: 6, wickets: 1 },
                currentOver: ['1', '4', '0', 'W', '2', '6'],
                target: 120,
                history: []
            });

            // Canvas & Overlay Elements
            const [selectedScene, setSelectedScene] = useState('Main Scoreboard');
            const [activeOverlay, setActiveOverlay] = useState('Main Scoreboard');
            const [elements, setElements] = useState([
                { id: '1', content: '{{TEAM_A_NAME}}', x: 80, y: 920, fontSize: 26, color: '#ffffff', bold: true },
                { id: '2', content: '{{TEAM_A_SCORE}} / {{TEAM_A_WICKETS}}', x: 320, y: 915, fontSize: 34, color: '#38bdf8', bold: true },
                { id: '3', content: '({{TEAM_A_OVERS}} OV)', x: 520, y: 925, fontSize: 18, color: '#a3e635', bold: false }
            ]);
            const [selectedElId, setSelectedElId] = useState('1');

            // Audio Synthesizer FX (Module 16)
            const playSoundFX = (type) => {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                if (type === '4') osc.frequency.setValueAtTime(500, ctx.currentTime);
                else if (type === '6') osc.frequency.setValueAtTime(750, ctx.currentTime);
                else if (type === 'wicket') osc.frequency.setValueAtTime(150, ctx.currentTime);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                osc.stop(ctx.currentTime + 0.4);
            };

            // Trigger Automatic Broadcast (Module 8 & 57)
            const triggerOverlay = (sceneName, sound = null) => {
                setActiveOverlay(sceneName);
                if (sound) playSoundFX(sound);
                if (sceneName !== 'Main Scoreboard') {
                    setTimeout(() => setActiveOverlay('Main Scoreboard'), 4500);
                }
            };

            // Scoring with History Snapshot (Module 24)
            const handleScoreAction = (runs, isWicket = false) => {
                // Save snapshot for Undo
                setMatch(prev => ({
                    ...prev,
                    history: [...prev.history, JSON.parse(JSON.stringify(prev))]
                }));

                if (isWicket) {
                    setMatch(prev => ({
                        ...prev,
                        teamA: { ...prev.teamA, wickets: prev.teamA.wickets + 1 }
                    }));
                    triggerOverlay('Wicket', 'wicket');
                } else {
                    setMatch(prev => ({
                        ...prev,
                        teamA: { ...prev.teamA, score: prev.teamA.score + runs },
                        striker: { ...prev.striker, runs: prev.striker.runs + runs, balls: prev.striker.balls + 1 },
                        currentOver: [...prev.currentOver.slice(-5), runs.toString()]
                    }));
                    if (runs === 4) triggerOverlay('Four', '4');
                    if (runs === 6) triggerOverlay('Six', '6');
                }
            };

            const handleUndo = () => {
                if (match.history.length === 0) {
                    alert('No scoring action to undo!');
                    return;
                }
                const previousState = match.history[match.history.length - 1];
                setMatch({
                    ...previousState,
                    history: match.history.slice(0, -1)
                });
            };

            return (
                <div className="min-h-screen flex flex-col bg-slate-950 text-gray-100">
                    {/* GLOBAL HEADER */}
                    <header className="bg-slate-900 border-b border-slate-800 px-6 py-3 flex justify-between items-center sticky top-0 z-50">
                        <div className="flex items-center gap-3 cursor-pointer" onClick={() => setCurrentView('home')}>
                            <i className="fa-solid fa-trophy text-amber-400 text-2xl"></i>
                            <div>
                                <h1 className="font-extrabold text-lg text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-lime-400">
                                    SRI LANKA SOFTBALL
                                </h1>
                                <p className="text-xs text-slate-400">Official Scoring & OBS Broadcast Engine</p>
                            </div>
                        </div>

                        <div className="flex bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs">
                            <button onClick={() => setCurrentView('home')} className={`px-3 py-1.5 rounded font-semibold ${currentView === 'home' ? 'bg-cyan-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}>Home</button>
                            <button onClick={() => setCurrentView('dashboard')} className={`px-3 py-1.5 rounded font-semibold ${currentView === 'dashboard' ? 'bg-cyan-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}>Tournament Dashboard</button>
                            <button onClick={() => setCurrentView('scoring')} className={`px-3 py-1.5 rounded font-semibold ${currentView === 'scoring' ? 'bg-cyan-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}>Scorer Mobile</button>
                            <button onClick={() => setCurrentView('obs')} className={`px-3 py-1.5 rounded font-semibold ${currentView === 'obs' ? 'bg-rose-600 text-white' : 'text-slate-400 hover:text-white'}`}>Permanent OBS Link</button>
                        </div>
                    </header>

                    {/* VIEW 1: HOME PAGE (Module 1 & 2) */}
                    {currentView === 'home' && (
                        <div className="p-8 max-w-6xl mx-auto w-full space-y-6">
                            <div className="flex justify-between items-center">
                                <div>
                                    <h2 className="text-2xl font-black text-white">Tournaments Management</h2>
                                    <p className="text-sm text-slate-400">Select or create softball tournaments</p>
                                </div>
                                <button onClick={() => alert('Create Tournament Wizard Opened!')} className="bg-cyan-500 hover:bg-cyan-400 text-slate-950 px-4 py-2 rounded-lg font-bold text-sm">
                                    <i className="fa-solid fa-plus mr-2"></i>Create Tournament
                                </button>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {tournaments.map(t => (
                                    <div key={t.id} className="bg-slate-900 border border-slate-800 p-5 rounded-xl flex flex-col justify-between space-y-4">
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <span className="text-xs bg-emerald-950 text-emerald-400 border border-emerald-800 px-2 py-0.5 rounded font-bold">{t.status}</span>
                                                <h3 className="text-lg font-bold text-white mt-2">{t.name}</h3>
                                                <p className="text-xs text-slate-400">Format: {t.type} | Teams: {t.teamsCount}</p>
                                            </div>
                                            <i className="fa-solid fa-award text-3xl text-cyan-500/40"></i>
                                        </div>
                                        <button onClick={() => { setCurrentView('dashboard'); }} className="w-full bg-slate-800 hover:bg-slate-700 py-2 rounded-lg text-sm font-bold text-cyan-400 border border-slate-700">
                                            Open Tournament Dashboard <i className="fa-solid fa-arrow-right ml-2"></i>
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* VIEW 2: TOURNAMENT DASHBOARD (Module 3 - 6 Tabs) */}
                    {currentView === 'dashboard' && (
                        <div className="flex-1 flex flex-col">
                            {/* Dashboard Sub Nav */}
                            <div className="bg-slate-900 border-b border-slate-800 px-6 py-2 flex justify-between items-center text-xs">
                                <div className="flex gap-2">
                                    {['matches', 'teams', 'table', 'stats', 'info', 'editor'].map(tab => (
                                        <button key={tab} onClick={() => setActiveDashboardTab(tab)} className={`px-4 py-1.5 rounded font-bold uppercase transition ${activeDashboardTab === tab ? 'bg-cyan-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}>
                                            {tab}
                                        </button>
                                    ))}
                                </div>
                                <span className="font-mono text-indigo-400 bg-indigo-950 px-3 py-1 rounded border border-indigo-800">OBS Link: {currentTournament.obsLink}</span>
                            </div>

                            {/* TAB: TEAMS & PLAYERS (Module 4 & 5) */}
                            {activeDashboardTab === 'teams' && (
                                <div className="p-6 max-w-6xl mx-auto w-full space-y-4">
                                    <h3 className="text-lg font-bold">Teams & Squad Management</h3>
                                    <div className="grid grid-cols-4 gap-4">
                                        {teams.map(team => (
                                            <div key={team.id} className="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-2">
                                                <div className="flex justify-between items-center">
                                                    <span className="font-black text-lg" style={{ color: team.color }}>{team.short}</span>
                                                    <span className="text-xs bg-slate-800 px-2 py-0.5 rounded text-slate-300">{team.group}</span>
                                                </div>
                                                <h4 className="font-bold text-white">{team.name}</h4>
                                                <p className="text-xs text-slate-400">{team.playersCount} Players registered</p>
                                                <button onClick={() => alert(`Opening player squad for ${team.name}`)} className="w-full mt-2 bg-slate-800 hover:bg-slate-700 text-cyan-400 py-1.5 rounded text-xs font-bold">
                                                    Manage Players
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* TAB: POINTS TABLE (Module 6) */}
                            {activeDashboardTab === 'table' && (
                                <div className="p-6 max-w-5xl mx-auto w-full space-y-4">
                                    <div className="flex justify-between items-center">
                                        <h3 className="text-lg font-bold">Group A Points Table</h3>
                                        <button onClick={() => alert('OBS Table Link Triggered')} className="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1 rounded border border-slate-700">SHOW ON OBS</button>
                                    </div>
                                    <div className="bg-slate-900 rounded-xl border border-slate-800 overflow-hidden">
                                        <table className="w-full text-left text-xs">
                                            <thead className="bg-slate-950 text-slate-400 border-b border-slate-800">
                                                <tr>
                                                    <th className="p-3">Pos</th>
                                                    <th className="p-3">Team</th>
                                                    <th className="p-3">P</th>
                                                    <th className="p-3">W</th>
                                                    <th className="p-3">L</th>
                                                    <th className="p-3">Pts</th>
                                                    <th className="p-3">NRR</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-800">
                                                <tr>
                                                    <td className="p-3 font-bold text-cyan-400">1</td>
                                                    <td className="p-3 font-bold">EAGLES</td>
                                                    <td className="p-3">3</td><td className="p-3">3</td><td className="p-3">0</td><td className="p-3 font-bold text-white">6</td><td className="p-3 text-lime-400">+2.450</td>
                                                </tr>
                                                <tr>
                                                    <td className="p-3 font-bold text-slate-400">2</td>
                                                    <td className="p-3 font-bold">WARRIORS</td>
                                                    <td className="p-3">3</td><td className="p-3">2</td><td className="p-3">1</td><td className="p-3 font-bold text-white">4</td><td className="p-3 text-lime-400">+1.120</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {/* TAB: EDITOR SUITE (Full 29 Modules) */}
                            {activeDashboardTab === 'editor' && (
                                <div className="flex-1 flex flex-col">
                                    {/* Editor Sub-toolbar */}
                                    <div className="bg-slate-900/80 border-b border-slate-800 px-6 py-2 flex gap-2 text-xs overflow-x-auto">
                                        <button onClick={() => setEditorSubTab('canvas')} className={`px-3 py-1.5 rounded ${editorSubTab === 'canvas' ? 'bg-slate-800 text-cyan-400 font-bold' : 'text-slate-400'}`}>Design Canvas</button>
                                        <button onClick={() => setEditorSubTab('controlRoom')} className={`px-3 py-1.5 rounded ${editorSubTab === 'controlRoom' ? 'bg-slate-800 text-cyan-400 font-bold' : 'text-slate-400'}`}>Live Control Room</button>
                                        <button onClick={() => setEditorSubTab('media')} className={`px-3 py-1.5 rounded ${editorSubTab === 'media' ? 'bg-slate-800 text-cyan-400 font-bold' : 'text-slate-400'}`}>Media Library</button>
                                        <button onClick={() => setEditorSubTab('sponsors')} className={`px-3 py-1.5 rounded ${editorSubTab === 'sponsors' ? 'bg-slate-800 text-cyan-400 font-bold' : 'text-slate-400'}`}>Sponsors & Watermark</button>
                                        <button onClick={() => setEditorSubTab('audio')} className={`px-3 py-1.5 rounded ${editorSubTab === 'audio' ? 'bg-slate-800 text-cyan-400 font-bold' : 'text-slate-400'}`}>Audio FX</button>
                                    </div>

                                    {editorSubTab === 'canvas' && (
                                        <div className="flex-1 grid grid-cols-12 gap-0">
                                            {/* Scenes List (Module 2) */}
                                            <div className="col-span-2 bg-slate-900 border-r border-slate-800 p-2 overflow-y-auto max-h-[calc(100vh-180px)]">
                                                <p className="text-[11px] font-bold text-slate-400 mb-2 px-2">BROADCAST SCENES</p>
                                                {DEFAULT_SCENES.map(scene => (
                                                    <button key={scene} onClick={() => setSelectedScene(scene)} className={`w-full text-left px-3 py-1.5 rounded text-xs mb-1 ${selectedScene === scene ? 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 font-bold' : 'text-slate-300 hover:bg-slate-800'}`}>
                                                        {scene}
                                                    </button>
                                                ))}
                                            </div>

                                            {/* Canvas Preview (Module 3 & 10) */}
                                            <div className="col-span-7 bg-slate-950 p-6 flex flex-col items-center justify-center">
                                                <div className="w-full max-w-4xl broadcast-canvas rounded-xl shadow-2xl relative border border-slate-800">
                                                    <div className="absolute bottom-0 inset-x-0 h-24 bg-slate-900/95 border-t-2 border-cyan-500 flex items-center px-6 justify-between">
                                                        <div className="flex items-center gap-4">
                                                            <div className="bg-cyan-600 text-slate-950 font-black px-4 py-2 clip-diagonal text-lg">
                                                                {match.teamA.name}
                                                            </div>
                                                            <div className="text-2xl font-black text-cyan-400">
                                                                {match.teamA.score} / {match.teamA.wickets} <span className="text-sm text-lime-400 font-normal">({match.teamA.overs} ov)</span>
                                                            </div>
                                                        </div>
                                                        <div className="text-xs text-right text-slate-300">
                                                            STRIKER: <strong>{match.striker.name}</strong> ({match.striker.runs})
                                                        </div>
                                                    </div>

                                                    {activeOverlay !== 'Main Scoreboard' && (
                                                        <div className="absolute inset-0 bg-cyan-500/90 flex flex-col justify-center items-center">
                                                            <h1 className="text-6xl font-black text-slate-950">{activeOverlay.toUpperCase()}</h1>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>

                                            {/* Dynamic Fields & Properties (Module 4 & 5) */}
                                            <div className="col-span-3 bg-slate-900 border-l border-slate-800 p-4 space-y-4">
                                                <h4 className="text-xs font-bold text-slate-400 uppercase">Dynamic Placeholders</h4>
                                                <select onChange={e => {
                                                    if (!e.target.value) return;
                                                    setElements([...elements, { id: Date.now().toString(), content: e.target.value, x: 200, y: 500, fontSize: 24, color: '#fff', bold: true }]);
                                                }} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-xs text-slate-200">
                                                    <option value="">+ Add Dynamic Field</option>
                                                    {DYNAMIC_FIELDS.map(f => <option key={f} value={f}>{f}</option>)}
                                                </select>
                                            </div>
                                        </div>
                                    )}

                                    {editorSubTab === 'controlRoom' && (
                                        <div className="p-6 grid grid-cols-12 gap-6">
                                            <div className="col-span-3 bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-2 text-xs">
                                                <h4 className="font-bold text-cyan-400">Live Control Room</h4>
                                                <p><span className="text-slate-400">Match:</span> {match.teamA.name} Batting</p>
                                                <p><span className="text-slate-400">Score:</span> {match.teamA.score}/{match.teamA.wickets}</p>
                                            </div>
                                            <div className="col-span-6 flex flex-col items-center">
                                                <div className="w-full broadcast-canvas rounded-xl border border-slate-800 flex items-end p-6">
                                                    <span className="text-2xl font-black text-cyan-400">{match.teamA.name} {match.teamA.score}/{match.teamA.wickets}</span>
                                                </div>
                                            </div>
                                            <div className="col-span-3 bg-slate-900 p-4 rounded-xl border border-slate-800 grid grid-cols-2 gap-2 text-xs">
                                                <button onClick={() => triggerOverlay('Main Scoreboard')} className="p-2 bg-slate-800 rounded font-bold">Main Score</button>
                                                <button onClick={() => triggerOverlay('Four', '4')} className="p-2 bg-lime-600 text-slate-950 font-bold">Show 4</button>
                                                <button onClick={() => triggerOverlay('Six', '6')} className="p-2 bg-cyan-600 text-slate-950 font-bold">Show 6</button>
                                                <button onClick={() => triggerOverlay('Wicket', 'wicket')} className="p-2 bg-rose-600 text-white font-bold">Show Wicket</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {activeDashboardTab === 'matches' && (
                                <div className="p-6 max-w-5xl mx-auto w-full space-y-4">
                                    <div className="flex justify-between items-center">
                                        <h3 className="text-lg font-bold">Match Schedule & Last Matches</h3>
                                        <button onClick={() => alert('New Match Setup Wizard opened')} className="bg-cyan-500 text-slate-950 px-4 py-2 rounded text-xs font-bold">+ New Match</button>
                                    </div>
                                    <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 flex justify-between items-center">
                                        <div>
                                            <span className="text-xs bg-rose-950 text-rose-400 px-2 py-0.5 rounded font-bold">LIVE NOW</span>
                                            <h4 className="font-bold text-white mt-1">Match No. 1: EAGLES vs WARRIORS</h4>
                                            <p className="text-xs text-slate-400">Group Match | 5 Overs</p>
                                        </div>
                                        <button onClick={() => setCurrentView('scoring')} className="bg-cyan-600 hover:bg-cyan-500 text-slate-950 px-4 py-2 rounded font-bold text-xs">
                                            Open Scorer Panel
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* VIEW 3: SCORER MOBILE INTERFACE (Module 19, 21, 24) */}
                    {currentView === 'scoring' && (
                        <div className="flex-1 max-w-md mx-auto w-full p-4 space-y-4">
                            <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 text-center">
                                <h2 className="text-sm font-bold text-slate-400">EAGLES vs WARRIORS</h2>
                                <div className="text-3xl font-black text-white mt-1">{match.teamA.score} / {match.teamA.wickets}</div>
                                <div className="text-xs text-lime-400 font-bold">{match.teamA.overs} OVERS</div>
                            </div>

                            {/* Over current delivery track */}
                            <div className="bg-slate-900 p-3 rounded-xl border border-slate-800 flex items-center justify-between">
                                <span className="text-xs text-slate-400">Current Over:</span>
                                <div className="flex gap-2">
                                    {match.currentOver.map((b, i) => (
                                        <span key={i} className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${b === 'W' ? 'bg-rose-600 text-white' : b === '4' || b === '6' ? 'bg-lime-500 text-slate-950' : 'bg-slate-800 text-white'}`}>{b}</span>
                                    ))}
                                </div>
                            </div>

                            {/* Keypad */}
                            <div className="grid grid-cols-4 gap-2">
                                {[0, 1, 2, 3, 4, 5, 6, 7].map(run => (
                                    <button key={run} onClick={() => handleScoreAction(run, false)} className={`p-4 rounded-xl font-black text-xl shadow border ${run === 4 || run === 6 ? 'bg-lime-500 text-slate-950 border-lime-400' : 'bg-slate-900 border-slate-800 text-white'}`}>
                                        {run}
                                    </button>
                                ))}
                            </div>

                            <div className="grid grid-cols-2 gap-2">
                                <button onClick={() => handleScoreAction(0, true)} className="p-4 bg-rose-600 text-white font-black rounded-xl shadow">OUT / WICKET</button>
                                <button onClick={handleUndo} className="p-4 bg-amber-600 text-white font-black rounded-xl shadow flex items-center justify-center gap-2">
                                    <i className="fa-solid fa-rotate-left"></i> UNDO
                                </button>
                            </div>
                        </div>
                    )}

                    {/* VIEW 4: PERMANENT TOURNAMENT OBS LINK (Module 26 & 58) */}
                    {currentView === 'obs' && (
                        <div className="w-screen h-screen bg-transparent flex flex-col justify-end p-8 relative overflow-hidden">
                            <div className="absolute top-4 right-4 bg-slate-900/90 px-3 py-1 rounded text-xs text-cyan-400 font-mono">
                                Permanent OBS URL: {currentTournament.obsLink}
                            </div>
                            <div className="w-full bg-slate-950/95 border-t-4 border-cyan-500 p-6 rounded-xl flex justify-between items-center shadow-2xl">
                                <div className="flex items-center gap-6">
                                    <div className="bg-cyan-500 text-slate-950 text-3xl font-black px-6 py-3 clip-diagonal">
                                        {match.teamA.name}
                                    </div>
                                    <div>
                                        <div className="text-5xl font-black text-cyan-400">{match.teamA.score} - {match.teamA.wickets}</div>
                                        <div className="text-sm text-lime-400 font-bold">{match.teamA.overs} OVERS</div>
                                    </div>
                                </div>
                                <div className="text-right">
                                    <div className="text-xl font-bold text-white">STRIKER: {match.striker.name} ({match.striker.runs})</div>
                                    <div className="text-sm text-slate-400">BOWLER: {match.bowler.name}</div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
