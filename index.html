/* Sri Lanka Softball reference UI theme */
:root{--purple:#4c10c7;--purple2:#792cff;--lav:#25105f;--ink:#fff;--muted:#d4c9ff;--line:#5726b8;--green:#00c66a;--red:#ff3e63;--white:#fff;--shadow:0 10px 26px #08001f66}

.topbar{background:linear-gradient(110deg,#19064b,#310b87 58%,#18063e);border-bottom:1px solid #5423c5;box-shadow:0 8px 25px #05001880}
.brandmark{background:linear-gradient(145deg,#ffd94b,#ffb900);color:#160647;border:2px solid #fff18c;border-radius:8px}

.sectiontitle{color:#fff}.muted,.smalltext{color:#d0c4fa}
.btn{background:linear-gradient(120deg,#761bff,#4210bd);border:1px solid #8d4cff;box-shadow:0 4px 12px #08001e55;color:#fff}
.btn.secondary{background:#25095f;color:#fff;border:1px solid #7d45ef}.btn.green{background:linear-gradient(120deg,#00d77b,#009e55);border:1px solid #24ff9c;color:#fff}.btn.red{background:linear-gradient(120deg,#ff4167,#bf1249)}
.btn.ghost{color:#fff}
.badge{background:#5418c6;color:#fff;border:1px solid #7c40ec}.badge.live{background:#fff21d;color:#1a1044;border-color:#fff76a}.badge.done{background:#50466d;color:#fff}
.staticon{background:#4a19a4;color:#fff}.stat strong{color:#fff}
.tournament h3,.team strong{color:#fff}
.logo{background:linear-gradient(140deg,#fff,#ded7ff);color:#23065f;border:1px solid #b8a1ff}
.matchteams{background:#f8f7ff;color:#171047;border-radius:13px;padding:12px 8px}
.matchteams .team strong{color:#171047}.matchteams .score{color:#160d54}.matchteams .vs{color:#5b1bcb}
.matchmeta{color:#e0d6ff}
.field label{color:#e0d5ff}.field input,.field select,.field textarea,.search input{background:#fff;color:#21133f;border-color:#c6b5f6}
.tabs .tab{background:#25085e;color:#e9dfff;border-color:#6b36d1}.tabs .tab.active{background:linear-gradient(110deg,#8a24ff,#4810bc);color:#fff;border-color:#a06bff}
.tablewrap{border-color:#6030bd}table{background:#2b0a70;color:#fff}th{background:#4a169e;color:#fff}td{border-color:#50229e}tr:last-child td{border-bottom:0}
.bottomnav{background:#17043f;border-top:1px solid #5922bc;box-shadow:0 -8px 25px #08001f88}.navitem{background:#17043f;color:#b8a5ec}.navitem.active{color:#fff;background:linear-gradient(0deg,#4c11b7,#17043f)}
.livehead{background:linear-gradient(125deg,#3a0c96,#200552);border:1px solid #6f2be7}.livehead .matchteams{background:#fff;color:#1a1044}.livehead .team strong{color:#160d54}.livehead .muted,.livehead .vs{color:#5522b8}
.scorebtn{background:#48139d;color:#fff;border:1px solid #7736d9}.scorebtn.boundary{background:#00b968;color:#fff}.scorebtn.out{background:#d71e4b;color:#fff}.scorebtn.extra{background:#6e31d2;color:#fff}
.notice{background:#3a1686;color:#f0e8ff;border:1px solid #6b39ce}.notice.warn{background:#4a2d08;color:#ffe5a0;border-color:#a16b1c}
.obsbox{background:#1d064e;border-color:#9c6bff}.overlaypreview{box-shadow:0 0 0 1px #7d42e8}
.ovteam{background:#08052d}.ovscore{background:linear-gradient(100deg,#12bfd7,#a4e83c);color:#10113a}
.modalback{background:#050018c9}.modal{background:#23075d;color:#fff;border:1px solid #7338db}.xbtn{background:#4a159e;color:#fff}
.toast{background:#351080;border:1px solid #8b4aff;color:#fff}
.empty{color:#d3c6f8}.dangerzone{background:#3b092f;border-color:#a5275a}
.copyright{color:#9b8acb}

<script>
const STORE_KEY='sl_softball_control_v3';
const DEFAULT={tournaments:[],activeTournament:null,activeMatch:null,teams:[],matches:[],players:[],settings:{adminPassword:'1234'},events:[]};
let db=loadDB(),page='home',moreTab='Teams',liveTab='Scorecard',loggedIn=false,selectedTournament=null,overlayTournament=null;
let lastScrollY=0;window.addEventListener('scroll',()=>{if(!document.body.classList.contains('live-score-focus')){document.body.classList.remove('score-header-hidden');return}let y=window.scrollY||0;if(y<20||y<lastScrollY-4)document.body.classList.remove('score-header-hidden');else if(y>lastScrollY+5)document.body.classList.add('score-header-hidden');lastScrollY=y},{passive:true});
function loadDB(){try{return {...structuredClone(DEFAULT),...JSON.parse(localStorage.getItem(STORE_KEY)||'{}')}}catch(e){return structuredClone(DEFAULT)}}
function saveDB(){localStorage.setItem(STORE_KEY,JSON.stringify(db))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function money(n){return Number(n||0).toLocaleString()}
function toast(s){const root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>root.innerHTML='',3000)}
function getTournament(id){return db.tournaments.find(t=>t.id===id)}
function activeT(){return getTournament(db.activeTournament)||db.tournaments[0]}
function matchesFor(tid){return db.matches.filter(m=>m.tournamentId===tid)}
function teamsFor(tid){return db.teams.filter(t=>t.tournamentId===tid)}
function playersFor(tid,teamId){return db.players.filter(p=>p.tournamentId===tid&&(!teamId||p.teamId===teamId))}
function activeM(){return db.matches.find(m=>m.id===db.activeMatch)||db.matches.find(m=>m.status==='Live')}
function logoHtml(src,name,cls='logo'){return `<div class="${cls}">${src?`<img src="${esc(src)}" alt="">`:esc((name||'SL').split(/\s+/).map(x=>x[0]).join('').slice(0,3).toUpperCase())}</div>`}
function uploadImage(input,callback){const f=input.files&&input.files[0];if(!f)return;if(f.size>2*1024*1024){toast('Image should be below 2 MB');input.value='';return}const r=new FileReader();r.onload=()=>callback(r.result);r.readAsDataURL(f)}
let previousPage='home';
let formOrigin={page:'home',moreTab:'Teams',selectedTournament:null};
function rememberFormOrigin(){formOrigin={page,moreTab,selectedTournament};}
function returnAfterRosterSave(tid,tab,message){saveDB();closeModal();toast(message);if(formOrigin.page==='tournaments'&&formOrigin.selectedTournament===tid){openTournament(tid);const btn=[...document.querySelectorAll('#main .tabs .tab')].find(x=>x.textContent.trim()===tab);if(btn)openTournamentTab(tid,tab,btn);return;}if(formOrigin.page==='matches'){page='matches';render();return;}page='more';moreTab=tab;render();}
function go(p){if(p!==page)previousPage=page;page=p;selectedTournament=null;document.body.classList.remove('live-score-focus','score-header-hidden');document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function goBack(){if(page==='home')return;if(page==='tournaments'&&selectedTournament){selectedTournament=null;go('tournaments');return}const target=(previousPage&&previousPage!==page)?previousPage:'home';const from=page;page=target;previousPage=from;document.body.classList.remove('live-score-focus','score-header-hidden');document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render()}
function render(){const root=document.getElementById('main');if(page==='home')root.innerHTML=homePage();else if(page==='tournaments')root.innerHTML=tournamentsPage();else if(page==='matches')root.innerHTML=matchesPage();else if(page==='overlay')root.innerHTML=overlayPage();else root.innerHTML=morePage();document.body.classList.toggle('live-score-focus',!!root.querySelector('.score-matchhead'));}
function pageHead(title,sub,button=''){const back=page!=='home'?`<button class="btn secondary small page-back" onclick="goBack()">← Back</button>`:'';return `<div class="pagehead"><div class="pagehead-title"><h2>${title}</h2><p>${sub}</p></div><div class="pagehead-actions">${back}${button}</div></div>`}
function homePage(){let t=activeT(),live=db.matches.filter(m=>m.status==='Live').length,complete=db.matches.filter(m=>m.status==='Complete').length;return `${pageHead('Dashboard','Manage tournaments, teams and live scoring.',`<button class="btn" onclick="openTournamentForm()">＋ Create Tournament</button>`)}
<div class="grid stats"><div class="card stat"><div class="staticon">🏆</div><div><strong>${db.tournaments.length}</strong><span>Tournaments</span></div></div><div class="card stat"><div class="staticon">🏏</div><div><strong>${db.matches.length}</strong><span>Total matches</span></div></div><div class="card stat"><div class="staticon">🔴</div><div><strong>${live}</strong><span>Live matches</span></div></div><div class="card stat"><div class="staticon">✓</div><div><strong>${complete}</strong><span>Completed</span></div></div></div>
<div class="grid two"><section class="card"><div class="row"><h3 class="sectiontitle">Your Tournaments</h3><button class="btn ghost small" onclick="go('tournaments')">View all →</button></div>${db.tournaments.length?db.tournaments.slice().reverse().map(t=>tournamentCard(t)).join(''):`<div class="empty"><div class="emoji">🏆</div><b>No tournaments yet</b><p>Create your first tournament to get started.</p><button class="btn" onclick="openTournamentForm()">Create Tournament</button></div>`}</section>
<section class="card"><div class="row"><h3 class="sectiontitle">Upcoming & Live Matches</h3><button class="btn ghost small" onclick="go('matches')">View all →</button></div>${db.matches.filter(m=>m.status!=='Complete').slice(0,4).map(matchCard).join('')||`<div class="empty"><div class="emoji">🏏</div><b>No matches scheduled</b><p>Open a tournament to add a match.</p></div>`}</section></div>
${t?`<section class="card" style="margin-top:16px"><div class="row wrap"><div class="tournament">${logoHtml(t.logo,t.name)}<div><h3>${esc(t.name)}</h3><p>${esc(t.place||'Venue not set')} · ${esc(t.type)} tournament</p></div></div><button class="btn" onclick="openTournament(t.id)">Open Tournament Dashboard</button></div></section>`:''}`}
function tournamentCard(t){return `<div class="card" style="box-shadow:none;margin-bottom:10px;padding:12px"><div class="row wrap"><div class="tournament">${logoHtml(t.logo,t.name)}<div><h3>${esc(t.name)}</h3><p>${esc(t.place||'Location not set')} · ${esc(t.type)} · ${t.startDate||'Date TBA'}</p><span class="badge">${matchesFor(t.id).length} matches</span></div></div><button class="btn small" onclick="openTournament('${t.id}')">Open</button></div></div>`}
function tournamentsPage(){return `${pageHead('Tournaments','Create and manage your softball competitions.',`<button class="btn" onclick="openTournamentForm()">＋ Create Tournament</button>`)}${db.tournaments.length?`<div class="grid two">${db.tournaments.slice().reverse().map(t=>`<section class="card"><div class="row"><div class="tournament">${logoHtml(t.logo,t.name)}<div><h3>${esc(t.name)}</h3><p>${esc(t.place||'Location not set')}</p></div></div><span class="badge">${esc(t.type)}</span></div><p class="muted">${t.startDate||'Date TBA'}${t.endDate?' — '+t.endDate:''} · ${teamsFor(t.id).length} teams · ${matchesFor(t.id).length} matches</p><div class="actions"><button class="btn small" onclick="openTournament('${t.id}')">Dashboard</button><button class="btn secondary small" onclick="openTournamentForm('${t.id}')">Edit</button><button class="btn secondary small" onclick="downloadTournament('${t.id}')">Export</button><button class="btn red small" onclick="deleteTournament('${t.id}')">Delete</button></div></section>`).join('')}</div>`:`<div class="card empty"><div class="emoji">🏆</div><b>No tournaments created</b><p>Tap Create Tournament to begin.</p></div>`}`}
function matchesPage(){let ms=db.matches.slice().reverse();return `${pageHead('Matches','Create a new match or schedule a future match.',`<div class="actions" style="margin:0"><button class="btn" onclick="openNewMatchWizard()">＋ New Match</button><button class="btn secondary" onclick="openScheduleMatch()">▣ Schedule Match</button></div>`)}<div class="tabs"><button class="tab active" onclick="filterMatches('All',this)">All</button><button class="tab" onclick="filterMatches('Upcoming',this)">Upcoming</button><button class="tab" onclick="filterMatches('Live',this)">Live</button><button class="tab" onclick="filterMatches('Complete',this)">Complete</button></div><div id="matchList" class="grid two">${ms.map(matchCard).join('')||`<div class="card empty"><div class="emoji">🏏</div><b>No matches yet</b><p>Choose New Match or Schedule Match.</p></div>`}</div>`}
function filterMatches(filter,el){document.querySelectorAll('.tabs .tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');let arr=db.matches.filter(m=>filter==='All'||m.status===filter);document.getElementById('matchList').innerHTML=arr.slice().reverse().map(matchCard).join('')||'<div class="card empty">No matches in this category.</div>'}
function teamBy(id){return db.teams.find(t=>t.id===id)}
function matchCard(m){let a=teamBy(m.teamA),b=teamBy(m.teamB),t=getTournament(m.tournamentId);return `<section class="card"><div class="row"><span class="badge ${m.status==='Live'?'live':m.status==='Complete'?'done':''}">${m.status==='Live'?'● ':''}${esc(m.status)}</span><span class="smalltext">${esc(m.matchType||'Match')}</span></div><div class="matchteams"><div class="team">${logoHtml(a&&a.logo,a&&a.name)}<strong>${esc(a?a.shortName||a.name:'Team A')}</strong><div class="score">${scoreText(m,'A')}</div></div><div class="vs">VS</div><div class="team">${logoHtml(b&&b.logo,b&&b.name)}<strong>${esc(b?b.shortName||b.name:'Team B')}</strong><div class="score">${scoreText(m,'B')}</div></div></div><div class="matchmeta"><span>📅 ${esc(m.date||'Date TBA')} ${esc(m.time||'')}</span><span>📍 ${esc(m.venue|| (t&&t.place)||'Venue TBA')}</span></div>${m.result?`<div class="notice"><b>${esc(m.result)}</b></div>`:''}<div class="actions">${m.status==='Live'?`<button class="btn green small" onclick="openLive('${m.id}')">Open Live Score</button>`:`<button class="btn small" onclick="${m.status==='Complete'?`openLive('${m.id}')`:`openMatchSetup('${m.id}')`}">${m.status==='Complete'?'View Score':'Match Setup'}</button>`}<button class="btn secondary small" onclick="openMatchForm('${m.id}')">Edit</button>${m.status!=='Complete'?`<button class="btn secondary small" onclick="startMatch('${m.id}')">Start Live</button>`:''}</div></section>`}
function scoreText(m,side){let s=m.score&&m.score[side];return s?`${s.runs}/${s.wickets} <small>(${oversText(s.balls,m.ballsPerOver||6)})</small>`:'—'}
function oversText(balls,perOver=6){return `${Math.floor((balls||0)/perOver)}.${(balls||0)%perOver}`}
function openTournament(id){db.activeTournament=id;selectedTournament=id;saveDB();page='tournaments';document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('active',b.dataset.page==='tournaments'));render();document.getElementById('main').innerHTML=tournamentDashboard(getTournament(id))}
function tournamentDashboard(t){let ms=matchesFor(t.id);return `${pageHead(esc(t.name),'Tournament dashboard · '+esc(t.type),`<button class="btn" onclick="openMatchForm(null,'${t.id}')">＋ Add Match</button>`)}<div class="row wrap" style="margin-bottom:16px"><div class="tournament">${logoHtml(t.logo,t.name)}<div><b>${esc(t.place||'Venue not set')}</b><p class="muted">${t.startDate||'Date TBA'}${t.endDate?' — '+t.endDate:''}</p></div></div><button class="btn secondary small" onclick="openTournamentForm('${t.id}')">Edit tournament</button></div><div class="tabs"><button class="tab active" onclick="openTournamentTab('${t.id}','Matches',this)">Matches</button><button class="tab" onclick="openTournamentTab('${t.id}','Teams',this)">Teams</button><button class="tab" onclick="openTournamentTab('${t.id}','Table',this)">Table</button><button class="tab" onclick="openTournamentTab('${t.id}','Stats',this)">Stats</button><button class="tab" onclick="openTournamentTab('${t.id}','Info',this)">Info</button><button class="tab" onclick="openTournamentTab('${t.id}','Overlay',this)">Overlay</button></div><div id="tournamentSub">${ms.slice().reverse().map(matchCard).join('')||'<div class="card empty">No matches yet. Tap Add Match to create one.</div>'}</div>`}
function openTournamentTab(tid,tab,el){document.querySelectorAll('.tabs .tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');let root=document.getElementById('tournamentSub');if(tab==='Matches')root.innerHTML=matchesFor(tid).slice().reverse().map(matchCard).join('')||'<div class="card empty">No matches yet.</div>';if(tab==='Teams')root.innerHTML=`<div class="row wrap"><h3 class="sectiontitle">Tournament Teams</h3><button class="btn small" onclick="openTeamForm(null,'${tid}')">＋ Add Team</button></div><div class="grid two">${teamsFor(tid).map(teamCard).join('')||'<div class="card empty">No teams added.</div>'}</div>`;if(tab==='Table')root.innerHTML=tableHtml(tid);if(tab==='Stats')root.innerHTML=statsHtml(tid);if(tab==='Info')root.innerHTML=`<div class="card"><h3>${esc(getTournament(tid).name)}</h3><p>Type: ${esc(getTournament(tid).type)}</p><p>Place: ${esc(getTournament(tid).place||'Not set')}</p><p>Dates: ${esc(getTournament(tid).startDate||'TBA')} — ${esc(getTournament(tid).endDate||'TBA')}</p><p>Groups: ${getTournament(tid).groups||1} · Wickets: ${getTournament(tid).wickets||10}</p><div class="actions"><button class="btn secondary" onclick="downloadTournament('${tid}')">Export tournament JSON</button><button class="btn secondary" onclick="openTournamentForm('${tid}')">Edit Info</button></div></div>`;if(tab==='Overlay')root.innerHTML=overlayForTournament(tid)}
function teamCard(t){return `<div class="card"><div class="row"><div class="tournament">${logoHtml(t.logo,t.name)}<div><h3>${esc(t.name)}</h3><p>${esc(t.shortName||'')} · ${esc(t.group||'No group')}</p></div></div><span class="badge">${playersFor(t.tournamentId,t.id).length} players</span></div><div class="actions"><button class="btn small" onclick="openTeamDetails('${t.id}')">Players</button><button class="btn secondary small" onclick="openTeamForm('${t.id}')">Edit</button><button class="btn red small" onclick="deleteTeam('${t.id}')">Delete</button></div></div>`}
function tableHtml(tid){let teams=teamsFor(tid),rows=teams.map(t=>{let played=0,w=0,l=0,pts=0,rf=0,ra=0;matchesFor(tid).filter(m=>m.status==='Complete').forEach(m=>{let side=m.teamA===t.id?'A':m.teamB===t.id?'B':null;if(!side)return;let other=side==='A'?'B':'A',s=m.score||{};played++;rf+=(s[side]?.runs||0);ra+=(s[other]?.runs||0);if((s[side]?.runs||0)>(s[other]?.runs||0)){w++;pts+=2}else if((s[side]?.runs||0)===(s[other]?.runs||0)){pts+=1}else l++});return {t,played,w,l,pts,rf,ra}}).sort((a,b)=>b.pts-a.pts||((b.rf-b.ra)-(a.rf-a.ra)));return `<div class="card"><h3 class="sectiontitle">Points Table</h3><p class="muted">Automatic basic table from completed matches. Official NRR rules need additional scoring data.</p><div class="tablewrap"><table><thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>L</th><th>Pts</th><th>Runs +/−</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.t.name)}</td><td>${r.played}</td><td>${r.w}</td><td>${r.l}</td><td><b>${r.pts}</b></td><td>${r.rf-r.ra}</td></tr>`).join('')||'<tr><td colspan="7">Add teams and complete matches to build the table.</td></tr>'}</tbody></table></div></div>`}
function statsHtml(tid){
 let p=playersFor(tid),bat=p.slice().sort((a,b)=>(b.runs||0)-(a.runs||0)),bowl=p.slice().sort((a,b)=>(b.wickets||0)-(a.wickets||0));
 return `<div class="grid two"><div class="card"><h3 class="sectiontitle">🏏 Batting Ranking</h3><div class="tablewrap"><table><thead><tr><th>Player</th><th>Runs</th><th>Balls</th><th>SR</th></tr></thead><tbody>${bat.map(x=>`<tr><td>${x.photo?`<img src="${esc(x.photo)}" style="width:28px;height:28px;object-fit:cover;border-radius:50%;vertical-align:middle;margin-right:6px">`:''}${esc(x.name)}</td><td>${x.runs||0}</td><td>${x.ballsFaced||0}</td><td>${x.ballsFaced?((x.runs||0)*100/x.ballsFaced).toFixed(1):'0.0'}</td></tr>`).join('')||'<tr><td colspan="4">No player data yet</td></tr>'}</tbody></table></div></div><div class="card"><h3 class="sectiontitle">🎯 Bowling Ranking</h3><div class="tablewrap"><table><thead><tr><th>Player</th><th>Overs</th><th>Runs</th><th>Wkts</th></tr></thead><tbody>${bowl.map(x=>`<tr><td>${x.photo?`<img src="${esc(x.photo)}" style="width:28px;height:28px;object-fit:cover;border-radius:50%;vertical-align:middle;margin-right:6px">`:''}${esc(x.name)}</td><td>${oversText(x.ballsBowled||0)}</td><td>${x.runsConceded||0}</td><td>${x.wickets||0}</td></tr>`).join('')||'<tr><td colspan="4">No player data yet</td></tr>'}</tbody></table></div></div></div>`;
}
function overlayForTournament(tid){let t=getTournament(tid);return `<div class="card"><h3 class="sectiontitle">Tournament OBS Overlay</h3><p class="muted">Use the overlay URL as a Browser Source in OBS. This local starter can preview graphics; shared live sync requires a backend connection.</p><div class="obsbox"><label>Overlay URL</label><p><code id="ovurl">${location.href.split('?')[0]}?overlay=${tid}</code></p><button class="btn secondary small" onclick="copyText(document.getElementById('ovurl').textContent)">Copy URL</button></div><div class="actions"><button class="btn" onclick="go('overlay');overlayTournament='${tid}';render()">Open Overlay Preview</button><button class="btn secondary" onclick="toast('Permanent tournament ID: ${tid}')">Show permanent ID</button></div></div>`}
function morePage(){return `${pageHead('More','Teams, players, rankings, schedules and data tools.')}<div class="tabs">${['Teams','Players','Ranking','Schedule','Import / Export','Settings'].map(x=>`<button class="tab ${moreTab===x?'active':''}" onclick="moreTab='${x}';render()">${x}</button>`).join('')}</div>${moreTab==='Teams'?teamsDirectory():moreTab==='Players'?playersDirectory():moreTab==='Ranking'?rankingPage():moreTab==='Schedule'?schedulePage():moreTab==='Import / Export'?backupPage():settingsPage()}`}
function teamsDirectory(){let t=activeT();return `<div class="row wrap"><h3 class="sectiontitle">Teams ${t?'— '+esc(t.name):''}</h3><button class="btn small" onclick="openTeamForm(null,'${t?t.id:''}')">＋ Add Team</button></div>${!t?'<div class="card empty">Create a tournament first.</div>':`<div class="grid two">${teamsFor(t.id).map(teamCard).join('')||'<div class="card empty">No teams added yet.</div>'}</div>`}`}
function playersDirectory(){let t=activeT();return `<div class="row wrap"><h3 class="sectiontitle">Player Directory</h3><button class="btn small" onclick="openPlayerForm(null,'${t?t.id:''}')">＋ Add Player</button></div>${!t?'<div class="card empty">Create a tournament first.</div>':`<div class="card"><div class="tablewrap"><table><thead><tr><th>Photo</th><th>Player</th><th>Team</th><th>Role</th><th>Actions</th></tr></thead><tbody>${playersFor(t.id).map(p=>`<tr><td>${p.photo?`<img class="directory-player-photo" src="${esc(p.photo)}" alt="">`:`<span class="directory-player-placeholder">🏏</span>`}</td><td>${esc(p.name)}</td><td>${esc((teamBy(p.teamId)||{}).name||'—')}</td><td>${esc(p.role||'—')}</td><td><button class="btn secondary small" onclick="openPlayerForm('${p.id}')">Edit</button> <button class="btn red small" onclick="deletePlayer('${p.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="5">No players yet.</td></tr>'}</tbody></table></div></div>`}`}
function rankingPage(){let t=activeT();return `<div class="grid three"><div class="card"><h3>🏏 Batting Ranking</h3><p class="muted">Runs and strike rate.</p></div><div class="card"><h3>🎯 Bowling Ranking</h3><p class="muted">Wickets and economy.</p></div><div class="card"><h3>🧤 Fielding Ranking</h3><p class="muted">Catches and run-outs.</p></div></div><div class="notice">Ranking pages are ready as sections; detailed player rankings need ball-by-ball batting, bowling and fielding data.</div>`}
function schedulePage(){return `<div class="card"><h3 class="sectiontitle">Match Schedule</h3><div class="tablewrap"><table><thead><tr><th>Date</th><th>Match</th><th>Venue</th><th>Status</th></tr></thead><tbody>${db.matches.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(m=>`<tr><td>${esc(m.date||'TBA')} ${esc(m.time||'')}</td><td>${esc((teamBy(m.teamA)||{}).name||'Team A')} vs ${esc((teamBy(m.teamB)||{}).name||'Team B')}</td><td>${esc(m.venue||'TBA')}</td><td>${esc(m.status)}</td></tr>`).join('')||'<tr><td colspan="4">No matches scheduled.</td></tr>'}</tbody></table></div></div>`}
function backupPage(){return `<div class="grid two"><div class="card"><h3>Export Backup</h3><p class="muted">Download all tournaments, teams, players and matches as a JSON backup.</p><button class="btn" onclick="exportBackup()">Download JSON Backup</button></div><div class="card"><h3>Import Backup</h3><p class="muted">Restore a previous backup. This replaces the current data on this device.</p><div class="field"><input type="file" accept=".json,application/json" id="backupFile"></div><button class="btn secondary" onclick="importBackup()">Import JSON Backup</button></div><div class="card"><h3>CSV Export</h3><p class="muted">Export the active tournament's teams and players as CSV files.</p><button class="btn secondary" onclick="exportCSV('teams')">Export Teams CSV</button> <button class="btn secondary" onclick="exportCSV('players')">Export Players CSV</button></div><div class="card"><h3>Storage note</h3><p class="muted">This version stores data in this browser only. Clearing browser data or using another phone will not sync this information.</p></div></div>`}
function settingsPage(){return `<div class="card"><h3 class="sectiontitle">Settings</h3><div class="notice warn">Demo security only: the admin PIN is stored in this browser and is not secure authentication.</div><div class="field"><label>Change local admin PIN</label><input id="newPin" type="password" placeholder="New PIN"></div><button class="btn" onclick="changePin()">Save PIN</button><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><div class="dangerzone"><b>Danger zone</b><p class="smalltext">Delete all locally stored tournament data from this browser.</p><button class="btn red" onclick="resetAll()">Delete all data</button></div></div>`}
function overlayPage(){let tid=overlayTournament||db.activeTournament||(db.tournaments[0]&&db.tournaments[0].id),t=getTournament(tid),m=db.matches.find(x=>x.id===db.activeMatch&&x.tournamentId===tid)||matchesFor(tid||'').find(x=>x.status==='Live')||matchesFor(tid||'')[0],a=m&&teamBy(m.teamA),b=m&&teamBy(m.teamB),s=m&&m.score||{A:{runs:0,wickets:0,balls:0},B:{runs:0,wickets:0,balls:0}};let live=m&&m.status==='Live';return `${pageHead('OBS Overlay','Transparent scoreboard preview for your broadcast.')}<div class="notice warn">The preview is not yet connected to remote OBS or cross-device live sync. Add a Browser Source using the overlay URL after backend integration.</div><div class="card"><div class="field"><label>Select tournament</label><select onchange="overlayTournament=this.value;render()">${db.tournaments.map(x=>`<option value="${x.id}" ${x.id===tid?'selected':''}>${esc(x.name)}</option>`).join('')||'<option value="">Create a tournament first</option>'}</select></div><div class="field"><label>Select match</label><select onchange="db.activeMatch=this.value;saveDB();render()">${matchesFor(tid||'').map(x=>`<option value="${x.id}" ${m&&x.id===m.id?'selected':''}>${esc((teamBy(x.teamA)||{}).name||'Team A')} vs ${esc((teamBy(x.teamB)||{}).name||'Team B')} — ${esc(x.status)}</option>`).join('')||'<option value="">No matches yet</option>'}</select></div><h3 class="sectiontitle">Live Overlay Preview</h3><div class="overlaypreview"><div class="ovteam">${logoHtml(a&&a.logo,a&&a.name,'')}<div>${esc(a&&a.shortName||a&&a.name||'TEAM A')}</div><small>${esc(a&&a.name||'')}</small></div><div class="ovscore"><div>${esc(t&&t.name||'SRI LANKA SOFTBALL')}</div><strong>${s.A?.runs||0}/${s.A?.wickets||0} · ${oversText(s.A?.balls||0)}</strong><div>${live?'LIVE':esc(m&&m.status||'MATCH')}</div><div class="ovbottom">${esc(m&&m.venue||t&&t.place||'')} · ${esc(m&&m.matchType||'Softball')}</div></div><div class="ovteam">${logoHtml(b&&b.logo,b&&b.name,'')}<div>${esc(b&&b.shortName||b&&b.name||'TEAM B')}</div><small>${esc(b&&b.name||'')}</small><b>${s.B?.runs||0}/${s.B?.wickets||0}</b></div></div><p class="smalltext">Suggested OBS canvas: 1920×1080. Browser Source width 1920, height 220; position at bottom. Transparent background can be enabled in the production overlay route.</p><div class="actions"><button class="btn secondary" onclick="copyText(location.href.split('?')[0]+'?overlay=${tid||''}')">Copy Overlay URL</button><button class="btn" onclick="openOverlayWindow('${tid||''}')">Open clean overlay view</button></div></div>`}
function openOverlayWindow(tid){let url=location.href.split('?')[0]+'?overlay='+encodeURIComponent(tid);window.open(url,'slsoftball_overlay','width=1200,height=400')}
function openLogin(){modal('Admin Login',`<div class="field"><label>Admin PIN</label><input id="adminPin" type="password" placeholder="Enter PIN"></div><p class="smalltext">Default demo PIN: 1234</p><button class="btn" onclick="doLogin()">Login</button>`)}
function doLogin(){let v=document.getElementById('adminPin').value;if(v===String(db.settings.adminPassword||'1234')){loggedIn=true;document.getElementById('loginBtn').textContent='Admin ✓';closeModal();toast('Admin mode enabled on this device')}else toast('Incorrect PIN')}
function changePin(){if(!loggedIn){toast('Login as admin first');return}let v=document.getElementById('newPin').value;if(!v){toast('Enter a new PIN');return}db.settings.adminPassword=v;saveDB();toast('Local PIN changed')}
function modal(title,body){document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><div class="modal-head-left"><button class="modal-back" type="button" onclick="closeModal()">← Back</button><h3>${title}</h3></div><button class="xbtn" aria-label="Close dialog" onclick="closeModal()">×</button></div>${body}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function previewImageFile(input,id){const f=input.files&&input.files[0],img=document.getElementById(id);if(!f||!img)return;if(f.size>5*1024*1024){toast('Image should be below 5 MB');input.value='';return}const r=new FileReader();r.onload=()=>{img.src=r.result;img.classList.remove('hide');img.dataset.original=r.result;const prefix=id==='teamLogoPreview'?'teamLogo':'playerPhoto';['Zoom','X','Y'].forEach(suffix=>{const el=document.getElementById(prefix+suffix);if(el)el.value=suffix==='Zoom'?1:0});updateCropPreview(id,1)};r.readAsDataURL(f)}
function updateCropPreview(id,zoom){const img=document.getElementById(id);if(!img)return;const prefix=id==='teamLogoPreview'?'teamLogo':'playerPhoto',x=Number(document.getElementById(prefix+'X')?.value||0),y=Number(document.getElementById(prefix+'Y')?.value||0);img.style.transform=`scale(${Number(zoom)||1}) translate(${x/4}%,${y/4}%)`;img.style.objectPosition=`${50+x/2}% ${50+y/2}%`}
function cropImageFile(input,prefix,callback){const file=input.files&&input.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const size=640,canvas=document.createElement('canvas');canvas.width=size;canvas.height=size;const ctx=canvas.getContext('2d'),zoom=Number(document.getElementById(prefix+'Zoom')?.value||1),x=Number(document.getElementById(prefix+'X')?.value||0),y=Number(document.getElementById(prefix+'Y')?.value||0),side=Math.min(img.width,img.height)/zoom,maxX=Math.max(0,img.width-side),maxY=Math.max(0,img.height-side),baseX=(img.width-side)/2,baseY=(img.height-side)/2,sx=Math.max(0,Math.min(maxX,baseX+(x/100)*maxX/2)),sy=Math.max(0,Math.min(maxY,baseY+(y/100)*maxY/2));ctx.drawImage(img,sx,sy,side,side,0,0,size,size);callback(canvas.toDataURL('image/jpeg',.9))};img.src=reader.result};reader.readAsDataURL(file)}
function openTournamentForm(id){let t=id?getTournament(id):{};modal(id?'Edit Tournament':'Create Tournament',`<form onsubmit="saveTournament(event,'${id||''}')"><div class="formgrid"><div class="field full"><label>Tournament name *</label><input name="name" required value="${esc(t.name||'')}" placeholder="e.g. Sri Lanka Softball Cup 2026"></div><div class="field"><label>Place / Ground</label><input name="place" value="${esc(t.place||'')}" placeholder="Ground name"></div><div class="field"><label>Tournament type</label><select name="type"><option ${t.type==='Knockout'?'selected':''}>Knockout</option><option ${t.type==='League'?'selected':''}>League</option><option ${t.type==='League + Knockout'?'selected':''}>League + Knockout</option></select></div><div class="field"><label>Start date</label><input type="date" name="startDate" value="${esc(t.startDate||'')}"></div><div class="field"><label>End date</label><input type="date" name="endDate" value="${esc(t.endDate||'')}"></div><div class="field"><label>Number of groups</label><input type="number" name="groups" min="1" max="32" value="${t.groups||1}"></div><div class="field"><label>Wickets per innings</label><input type="number" name="wickets" min="1" max="20" value="${t.wickets||10}"></div><div class="field full"><label>Tournament logo (optional, max 2 MB)</label><input type="file" accept="image/*" id="tLogo"></div></div><div class="actions"><button class="btn" type="submit">Save Tournament</button><button class="btn secondary" type="button" onclick="closeModal()">Cancel</button></div></form>`)}
function saveTournament(e,id){e.preventDefault();let f=e.target,old=id?getTournament(id):null;let t={id:id||uid(),name:f.name.value.trim(),place:f.place.value.trim(),type:f.type.value,startDate:f.startDate.value,endDate:f.endDate.value,groups:+f.groups.value||1,wickets:+f.wickets.value||10,logo:old&&old.logo||''};let input=document.getElementById('tLogo');const finish=()=>{if(old)Object.assign(old,t);else db.tournaments.push(t);db.activeTournament=t.id;saveDB();closeModal();toast(old?'Tournament updated':'Tournament created');go('tournaments');openTournament(t.id)};if(input.files[0])uploadImage(input,data=>{t.logo=data;finish()});else finish()}
function deleteTournament(id){if(!confirm('Delete this tournament and its teams, players and matches?'))return;db.tournaments=db.tournaments.filter(t=>t.id!==id);db.matches=db.matches.filter(m=>m.tournamentId!==id);db.teams=db.teams.filter(t=>t.tournamentId!==id);db.players=db.players.filter(p=>p.tournamentId!==id);if(db.activeTournament===id)db.activeTournament=null;saveDB();render();toast('Tournament deleted')}

function saveTeam(e,id,tid){e.preventDefault();let f=e.target,old=id?teamBy(id):null,name=f.name.value.trim(),t={id:id||uid(),tournamentId:tid,name,shortName:f.shortName.value.trim()||name.split(/\s+/).map(x=>x[0]).join('').slice(0,4).toUpperCase(),group:f.group.value.trim(),logo:old&&old.logo||''};let finish=()=>{if(old)Object.assign(old,t);else db.teams.push(t);db.activeTournament=tid;returnAfterRosterSave(tid,'Teams',old?'Team updated':'Team saved')};let inp=document.getElementById('teamLogo');if(inp&&inp.files&&inp.files[0])cropImageFile(inp,'teamLogo',d=>{t.logo=d;finish()});else finish()}

function openPlayerForm(id,tid,teamId){rememberFormOrigin();let old=id?db.players.find(p=>p.id===id):null;tid=tid||(old&&old.tournamentId)||db.activeTournament;teamId=teamId||(old&&old.teamId)||'';let teams=teamsFor(tid||'');if(!getTournament(tid)){toast('Create a tournament first');return}modal(old?'Edit Player':'Add Player',`<form onsubmit="savePlayer(event,'${id||''}','${tid}')"><div class="formgrid"><div class="field full"><label>Player full name *</label><input name="name" required value="${esc(old&&old.name||'')}"></div><div class="field"><label>Team</label><select name="teamId"><option value="">Unassigned</option>${teams.map(t=>`<option value="${t.id}" ${t.id===(old&&old.teamId||teamId)?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Role</label><select name="role"><option value="">Select role</option>${['Batsman','Bowler','All-rounder','Wicket Keeper','Captain'].map(r=>`<option ${old&&old.role===r?'selected':''}>${r}</option>`).join('')}</select></div><div class="field"><label>Age</label><input type="number" name="age" min="1" max="100" value="${esc(old&&old.age||'')}"></div><div class="field"><label>Jersey number</label><input type="number" name="number" min="0" value="${esc(old&&old.number||'')}"></div><div class="field full"><label>Player photo — upload, crop and zoom</label><input type="file" id="playerPhoto" accept="image/*" onchange="previewImageFile(this,'playerPhotoPreview')"><div class="crop-preview">${old&&old.photo?`<img id="playerPhotoPreview" src="${esc(old.photo)}">`:'<img id="playerPhotoPreview" class="hide">'}<div class="crop-controls"><label>Zoom <input id="playerPhotoZoom" type="range" min="1" max="3" step="0.1" value="1" oninput="updateCropPreview('playerPhotoPreview',this.value)"></label><label>Horizontal crop <input id="playerPhotoX" type="range" min="-100" max="100" value="0" oninput="updateCropPreview('playerPhotoPreview',document.getElementById('playerPhotoZoom').value)"></label><label>Vertical crop <input id="playerPhotoY" type="range" min="-100" max="100" value="0" oninput="updateCropPreview('playerPhotoPreview',document.getElementById('playerPhotoZoom').value)"></label></div></div></div></div><div class="actions"><button class="btn">Save Player</button><button class="btn secondary" type="button" onclick="closeModal()">Cancel</button></div></form>`)}
function savePlayer(e,id,tid){e.preventDefault();let f=e.target,old=id?db.players.find(p=>p.id===id):null,p={id:id||uid(),tournamentId:tid,teamId:f.teamId.value,name:f.name.value.trim(),role:f.role.value,age:f.age.value,number:f.number.value,photo:old&&old.photo||'',runs:old&&old.runs||0,ballsFaced:old&&old.ballsFaced||0,wickets:old&&old.wickets||0,ballsBowled:old&&old.ballsBowled||0,runsConceded:old&&old.runsConceded||0};let finish=()=>{if(old)Object.assign(old,p);else db.players.push(p);db.activeTournament=tid;returnAfterRosterSave(tid,'Players',old?'Player updated':'Player saved')};let inp=document.getElementById('playerPhoto');if(inp&&inp.files&&inp.files[0])cropImageFile(inp,'playerPhoto',d=>{p.photo=d;finish()});else finish()}

const MATCH_TYPES=['Group Match','Quarter Final','Semi Final 1','Semi Final 2','Eliminator 1','Qualifier 1','Eliminator 2','Final'];
function openNewMatchWizard(tid){tid=tid||db.activeTournament||(db.tournaments[0]||{}).id;window.currentMatchWizardTid=tid;const t=getTournament(tid);if(!t){toast('Please create a tournament first');return}const teams=teamsFor(tid);if(teams.length<2){toast('Add at least two teams before creating a match');return}modal('New Match',`<div class="wizard-step"><span class="badge">STEP 1 OF 2</span><h3>Match details</h3><div class="field"><label>Match name</label><input id="nmTitle" placeholder="e.g. Match 01"></div><div class="formgrid"><div class="field"><label>Overs</label><input id="nmOvers" type="number" min="1" max="100" value="10"></div><div class="field"><label>Balls per over</label><input id="nmBalls" type="number" min="1" max="12" value="6"></div><div class="field full"><label>Match type</label><select id="nmType">${MATCH_TYPES.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Team A</label><select id="nmTeamA" onchange="refreshPlayingXI('A')">${teams.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Team B</label><select id="nmTeamB" onchange="refreshPlayingXI('B')">${teams.map((x,i)=>`<option value="${x.id}" ${i===1?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Date</label><input id="nmDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Time</label><input id="nmTime" type="time"></div></div><div class="playingxi-grid"><section class="xi-panel"><div class="xi-head"><h4 id="xiTitleA">Team A · Playing XI</h4><button class="btn secondary small" type="button" onclick="quickAddWizardPlayer('A')">＋ Add Player</button></div><div id="xiA">${playingXIHtml(tid,teams[0].id,'A')}</div></section><section class="xi-panel"><div class="xi-head"><h4 id="xiTitleB">Team B · Playing XI</h4><button class="btn secondary small" type="button" onclick="quickAddWizardPlayer('B')">＋ Add Player</button></div><div id="xiB">${playingXIHtml(tid,teams[1].id,'B')}</div></section></div><div class="actions"><button class="btn" onclick="newMatchToToss('${tid}')">Next → Toss details</button><button class="btn secondary" onclick="closeModal()">Cancel</button></div></div>`)}
function quickAddWizardPlayer(side){const tid=window.currentMatchWizardTid||db.activeTournament;const teamId=document.getElementById(side==='A'?'nmTeamA':'nmTeamB')?.value;if(!teamId)return;modal('Add Player to '+((teamBy(teamId)||{}).name||'Team'),`<form onsubmit="saveWizardPlayer(event,'${side}','${tid}','${teamId}')"><div class="field"><label>Player name *</label><input name="name" required placeholder="Full name"></div><div class="field"><label>Role</label><select name="role"><option>Batsman</option><option>Bowler</option><option>All-rounder</option><option>Wicket Keeper</option><option>Captain</option></select></div><div class="field"><label>Jersey number</label><input name="number" type="number" min="0"></div><div class="actions"><button class="btn">Save Player</button><button class="btn secondary" type="button" onclick="openNewMatchWizard('${tid}')">Cancel</button></div></form>`)}
function saveWizardPlayer(e,side,tid,teamId){e.preventDefault();const f=e.target,p={id:uid(),tournamentId:tid,teamId,name:f.name.value.trim(),role:f.role.value,number:f.number.value,age:'',photo:'',runs:0,ballsFaced:0,wickets:0,ballsBowled:0,runsConceded:0};db.players.push(p);saveDB();closeModal();const box=document.getElementById('xi'+side);if(box){box.innerHTML=playingXIHtml(tid,teamId,side);const checks=[...box.querySelectorAll('input[type=checkbox]')];checks.forEach(c=>c.checked=c.value===p.id||c.checked);const h=document.getElementById('xiTitle'+side);if(h)h.textContent=(teamBy(teamId)||{}).name+' · Playing XI'}toast('Player added and selected for Playing XI')}
function playingXIHtml(tid,teamId,side){const ps=playersFor(tid,teamId);if(!ps.length)return '<p class="smalltext">No players added to this team yet. Add players under More → Players.</p>';return ps.map((p,i)=>`<label class="xi-player"><input type="checkbox" class="xi-${side}" value="${p.id}" ${i<11?'checked':''}><span>${p.photo?`<img src="${esc(p.photo)}" alt="">`:'<span class="xi-avatar">🏏</span>'}</span><b>${esc(p.name)}</b><small>${esc(p.role||'Player')}</small></label>`).join('')}
function refreshPlayingXI(side){const tid=window.currentMatchWizardTid||db.activeTournament||(db.tournaments[0]||{}).id;const a=document.getElementById('nmTeamA'),b=document.getElementById('nmTeamB');if(!a||!b)return;const teamId=(side==='A'?a:b).value;document.getElementById('xi'+side).innerHTML=playingXIHtml(tid,teamId,side);document.getElementById('xiTitle'+side).textContent=(teamBy(teamId)||{}).name+' · Playing XI';if(a.value===b.value){toast('Team A and Team B must be different');}}
function newMatchToToss(tid){const title=document.getElementById('nmTitle').value.trim()||'Match '+(matchesFor(tid).length+1),overs=+document.getElementById('nmOvers').value,balls=+document.getElementById('nmBalls').value,teamA=document.getElementById('nmTeamA').value,teamB=document.getElementById('nmTeamB').value;if(teamA===teamB){toast('Choose two different teams');return}if(!overs||overs<1||!balls||balls<1){toast('Enter valid overs and balls per over');return}const xiA=[...document.querySelectorAll('.xi-A:checked')].map(x=>x.value),xiB=[...document.querySelectorAll('.xi-B:checked')].map(x=>x.value);if(xiA.length<2||xiB.length<1){toast('Select at least two players for Team A and one or more for Team B');return}window.pendingMatchDraft={tid,title,overs,balls,teamA,teamB,date:document.getElementById('nmDate').value,time:document.getElementById('nmTime').value,type:document.getElementById('nmType').value,xiA,xiB};modal('Toss details',`<div class="notice">Choose the toss winner and whether they elected to bat or bowl.</div><div class="field"><label>Toss winner</label><select id="nmTossWinner"><option value="${teamA}">${esc((teamBy(teamA)||{}).name)}</option><option value="${teamB}">${esc((teamBy(teamB)||{}).name)}</option></select></div><div class="field"><label>Toss decision</label><div class="toss-choice"><label><input type="radio" name="nmDecision" value="bat" checked><span>🏏 Elected to Bat</span></label><label><input type="radio" name="nmDecision" value="bowl"><span>⚾ Elected to Bowl</span></label></div></div><div class="actions"><button class="btn" onclick="createMatchFromWizard()">Create Match</button><button class="btn secondary" onclick="openNewMatchWizard('${tid}')">← Back</button></div>`)}
function createMatchFromWizard(){const d=window.pendingMatchDraft;if(!d)return;const {tid,title,overs,balls,teamA,teamB,type,date,time,xiA,xiB}=d,winner=document.getElementById('nmTossWinner').value,decision=document.querySelector('input[name="nmDecision"]:checked')?.value||'bat',battingTeam=decision==='bat'?winner:(winner===teamA?teamB:teamA);const m={id:uid(),tournamentId:tid,title,matchType:type,overs,ballsPerOver:balls,teamA,teamB,date,time,venue:(getTournament(tid)||{}).place||'',status:'Live',score:{A:{runs:0,wickets:0,balls:0},B:{runs:0,wickets:0,balls:0}},innings:1,batting:battingTeam===teamA?'A':'B',striker:'',nonStriker:'',bowler:'',thisOver:[],thisOverBalls:0,toss:`${(teamBy(winner)||{}).name} won the toss and elected to ${decision}`,playingXI:{A:xiA,B:xiB},partnershipRuns:0,partnershipBalls:0};db.matches.push(m);db.activeMatch=m.id;db.activeTournament=tid;saveDB();closeModal();openLive(m.id);selectInitialLivePlayers(m.id);toast('Match created successfully')}
function selectInitialLivePlayers(id){const m=db.matches.find(x=>x.id===id);if(!m)return;const side=currentSide(m),batTeam=side==='A'?m.teamA:m.teamB,bowlTeam=side==='A'?m.teamB:m.teamA,bp=(m.playingXI&&m.playingXI[side]||[]).map(pid=>db.players.find(p=>p.id===pid)).filter(Boolean),bs=(m.playingXI&&m.playingXI[side==='A'?'B':'A']||[]).map(pid=>db.players.find(p=>p.id===pid)).filter(Boolean);if(bp.length<2||bs.length<1){toast('Add at least two batting players and one bowling player before scoring');return}modal('Select opening players',`<div class="notice">Select two different batters and the opening bowler before scoring.</div><div class="field"><label>Striker</label><select id="initStriker">${bp.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Non-striker</label><select id="initNon">${bp.map((p,i)=>`<option value="${p.id}" ${i===1?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Opening bowler</label><select id="initBowler">${bs.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><button class="btn" onclick="saveInitialPlayers('${id}')">Confirm players</button>`)}
function saveInitialPlayers(id){const m=db.matches.find(x=>x.id===id);if(!m)return;const st=document.getElementById('initStriker').value,ns=document.getElementById('initNon').value,bw=document.getElementById('initBowler').value;if(!st||!ns||st===ns||!bw){toast('Select two different batters and one bowler');return}m.striker=st;m.nonStriker=ns;m.bowler=bw;saveDB();closeModal();openLive(id)}

 let overEnded=false;if((m.thisOverBalls||0)>=(m.ballsPerOver||6)){m.thisOverBalls=0;m.thisOver=[];m.thisOverRuns=0;[m.striker,m.nonStriker]=[m.nonStriker,m.striker];overEnded=true;}
 if(type==='run'&&n===4)showGraphic(id,'FOUR',false);if(type==='run'&&n===6)showGraphic(id,'SIX',false);
 if(s.wickets>=((getTournament(m.tournamentId)||{}).wickets||10)||s.balls>=m.overs*(m.ballsPerOver||6))toast('Innings limit reached. End or change innings.');
 saveDB();openLive(id);if(overEnded){toast('Over completed — select the next bowler');setTimeout(()=>editNextBowler(id),250)}else if(type==='wicket'&&!window.skipNextBatterPrompt){setTimeout(()=>editNextBatter(id),250)}window.skipNextBatterPrompt=false
}
function editNextBowler(id){const m=db.matches.find(x=>x.id===id);if(!m||m.status!=='Live')return;const side=currentSide(m),team=side==='A'?m.teamA:m.teamB,players=(m.playingXI&&m.playingXI[side==='A'?'B':'A']||[]).map(pid=>db.players.find(p=>p.id===pid)).filter(Boolean);if(!players.length){modal('New over — Add bowler',`<div class="notice">No bowler is available in the selected Playing XI. Add a player to the bowling team.</div><button class="btn" onclick="quickAddMatchPlayer('${id}','${team===m.teamA?m.teamA:m.teamB}')">＋ Add Bowler</button><button class="btn secondary" onclick="closeModal()">Back</button>`);return}modal('New over — Select bowler',`<div class="notice">The previous over is complete. Select the bowler for the next over.</div><div class="field"><label>Bowler</label><select id="nextOverBowler">${players.map(p=>`<option value="${p.id}" ${p.id===m.bowler?'disabled':''}>${esc(p.name)}</option>`).join('')}</select></div><button class="btn" onclick="saveNextBowler('${id}')">Confirm Bowler</button>`)}
function saveNextBowler(id){const m=db.matches.find(x=>x.id===id);const b=document.getElementById('nextOverBowler').value;if(!b){toast('Select a bowler');return}m.bowler=b;m.bowlerBalls=0;m.bowlerRuns=0;m.bowlerWickets=0;saveDB();closeModal();openLive(id)}
function editNextBatter(id){const m=db.matches.find(x=>x.id===id);if(!m)return;const side=currentSide(m),team=side==='A'?m.teamA:m.teamB,xi=(m.playingXI&&m.playingXI[side]||[]).map(pid=>db.players.find(p=>p.id===pid)).filter(Boolean),available=xi.filter(p=>p.id!==m.striker&&p.id!==m.nonStriker);if(!available.length){modal('Wicket — Add next batter',`<div class="notice">No unused batter is available in the Playing XI. Add a batter to continue.</div><button class="btn" onclick="quickAddMatchPlayer('${id}','${team}')">＋ Add Batter</button><button class="btn secondary" onclick="closeModal()">Back</button>`);return}modal('Wicket — Select next batter',`<div class="notice">Choose the incoming batter to continue scoring.</div><div class="field"><label>Incoming batter</label><select id="incomingBatter">${available.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><button class="btn" onclick="saveIncomingBatter('${id}')">Confirm Batter</button>`)}
function saveIncomingBatter(id){const m=db.matches.find(x=>x.id===id);const p=document.getElementById('incomingBatter').value;if(!p)return; if(m.striker===m.lastWicket?.batter)m.striker=p;else m.nonStriker=p;saveDB();closeModal();openLive(id)}
function undoBall(id){let idx=-1;for(let i=db.events.length-1;i>=0;i--)if(db.events[i].matchId===id){idx=i;break}if(idx<0){toast('Nothing to undo');return}let e=db.events.splice(idx,1)[0],m=db.matches.find(x=>x.id===id);if(m){m.score[e.side]=e.old;m.thisOver=e.oldOver;m.thisOverRuns=Number(e.oldThisOverRuns||0);m.batting=e.oldBatting;m.striker=e.oldStriker;m.nonStriker=e.oldNonStriker;m.bowler=e.oldBowler;m.thisOverBalls=e.oldThisOverBalls;m.partnershipRuns=e.oldPartnershipRuns;m.partnershipBalls=e.oldPartnershipBalls;m.bowlerBalls=e.oldBowlerBalls;m.bowlerRuns=e.oldBowlerRuns;m.bowlerWickets=e.oldBowlerWickets;Object.entries(e.oldPlayers||{}).forEach(([pid,st])=>{let p=db.players.find(x=>x.id===pid);if(p)Object.assign(p,st)});saveDB();openLive(id);toast('Last ball undone')}}
function changeEnds(id){let m=db.matches.find(x=>x.id===id);if(m){[m.striker,m.nonStriker]=[m.nonStriker,m.striker];saveDB();openLive(id);toast('Striker / non-striker changed')}}
function setStrikeRole(matchId,playerId,role){const m=db.matches.find(x=>x.id===matchId);if(!m||!playerId){toast('Select a player first');return}if(role==='striker'){if(m.nonStriker===playerId)m.nonStriker=m.striker;m.striker=playerId}else{if(m.striker===playerId)m.striker=m.nonStriker;m.nonStriker=playerId}saveDB();openLive(matchId);toast(role==='striker'?'Striker selected':'Non-striker selected')}
function endInnings(id){let m=db.matches.find(x=>x.id===id);if(!m)return;if(m.innings===1){if(!confirm('End first innings and start the second innings?'))return;m.innings=2;m.batting=m.batting==='A'?'B':'A';m.thisOver=[];m.thisOverRuns=0;m.thisOverBalls=0;m.striker='';m.nonStriker='';m.bowler='';saveDB();openLive(id);toast('Second innings started')}else{if(confirm('End second innings and mark match complete?'))finishMatch(id)}}
function finishMatch(id){let m=db.matches.find(x=>x.id===id);if(!m)return;if(!confirm('End this match and mark it Complete?'))return;const a=m.score.A.runs||0,b=m.score.B.runs||0,ta=teamBy(m.teamA),tb=teamBy(m.teamB);m.status='Complete';if(a>b)m.result=`${ta&&ta.name||'Team A'} won by ${a-b} runs`;else if(b>a)m.result=`${tb&&tb.name||'Team B'} won by ${b-a} runs`;else m.result='Match tied';saveDB();go('matches');toast(m.result)}
function editLivePlayers(id){let m=db.matches.find(x=>x.id===id),side=currentSide(m),bat=side==='A'?teamBy(m.teamA):teamBy(m.teamB),bowl=side==='A'?teamBy(m.teamB):teamBy(m.teamA),bp=playersFor(m.tournamentId,bat&&bat.id),wp=playersFor(m.tournamentId,bowl&&bowl.id);modal('Select Players',`<div class="field"><label>Striker</label><select id="striker">${bp.map(p=>`<option value="${p.id}" ${m.striker===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Non-striker</label><select id="nonStriker">${bp.map(p=>`<option value="${p.id}" ${m.nonStriker===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Bowler</label><select id="bowler">${wp.map(p=>`<option value="${p.id}" ${m.bowler===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="actions"><button class="btn" onclick="saveLivePlayers('${id}')">Save Players</button><button class="btn secondary" onclick="quickAddMatchPlayer('${id}','${bat&&bat.id||''}')">＋ Add Batter</button><button class="btn secondary" onclick="quickAddMatchPlayer('${id}','${bowl&&bowl.id||''}')">＋ Add Bowler</button></div><p class="smalltext">New players are added to the selected team and can be selected here.</p>`)}
function saveLivePlayers(id){let m=db.matches.find(x=>x.id===id);m.striker=document.getElementById('striker').value;m.nonStriker=document.getElementById('nonStriker').value;m.bowler=document.getElementById('bowler').value;saveDB();closeModal();openLive(id)}
function quickAddMatchPlayer(matchId,teamId){const m=db.matches.find(x=>x.id===matchId);if(!m||!teamId){toast('Choose a team first');return}modal('Quick Add Player',`<form onsubmit="saveQuickMatchPlayer(event,'${matchId}','${teamId}')"><div class="field"><label>Player name *</label><input name="name" required placeholder="Full name"></div><div class="field"><label>Role</label><select name="role"><option>Batsman</option><option>Bowler</option><option>All-rounder</option><option>Wicket Keeper</option></select></div><div class="field"><label>Jersey number</label><input name="number" type="number" min="0"></div><div class="field"><label>Player photo (optional)</label><input id="quickPlayerPhoto" type="file" accept="image/*"></div><div class="actions"><button class="btn">Save Player</button><button class="btn secondary" type="button" onclick="editLivePlayers('${matchId}')">Cancel</button></div></form>`)}
function saveQuickMatchPlayer(e,matchId,teamId){e.preventDefault();const f=e.target,m=db.matches.find(x=>x.id===matchId);const p={id:uid(),tournamentId:m.tournamentId,teamId,name:f.name.value.trim(),role:f.role.value,number:f.number.value,age:'',photo:'',runs:0,ballsFaced:0,wickets:0,ballsBowled:0,runsConceded:0};const file=document.getElementById('quickPlayerPhoto');const finish=()=>{db.players.push(p);m.playingXI=m.playingXI||{A:[],B:[]};const side=teamId===m.teamA?'A':'B';m.playingXI[side]=m.playingXI[side]||[];m.playingXI[side].push(p.id);saveDB();editLivePlayers(matchId);toast('Player added to team')};if(file&&file.files&&file.files[0])uploadImage(file,data=>{p.photo=data;finish()});else finish()}
function editToss(id){let m=db.matches.find(x=>x.id===id);modal('Toss Details',`<div class="field"><label>Toss text</label><input id="tossText" value="${esc(m.toss||'')}" placeholder="Team won toss and elected to bat"></div><button class="btn" onclick="saveToss('${id}')">Save Toss</button>`)}
function saveToss(id){let m=db.matches.find(x=>x.id===id);m.toss=document.getElementById('tossText').value;saveDB();closeModal();openLive(id)}
function showGraphic(id,graphic,rerender=true){let m=db.matches.find(x=>x.id===id);if(!m)return;m.graphic=graphic;saveDB();if(rerender)openLive(id);else toast(graphic+' graphic selected in local preview')}
function copyText(text){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>toast('Copied')).catch(()=>prompt('Copy this text:',text));else prompt('Copy this text:',text)}
function downloadFile(name,content,type='application/json'){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportBackup(){downloadFile('sri-lanka-softball-backup.json',JSON.stringify(db,null,2))}
function importBackup(){let f=document.getElementById('backupFile').files[0];if(!f){toast('Choose a JSON file first');return}let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.tournaments)||!Array.isArray(d.matches))throw Error();if(!confirm('Replace current local data with this backup?'))return;db={...structuredClone(DEFAULT),...d};saveDB();render();toast('Backup imported')}catch(e){toast('Invalid backup JSON')}};r.readAsText(f)}
function exportCSV(kind){let t=activeT();if(!t){toast('Create a tournament first');return}let arr=kind==='teams'?teamsFor(t.id):playersFor(t.id),keys=kind==='teams'?['name','shortName','group']:['name','teamId','role','age','number'];let csv=[keys.join(','),...arr.map(o=>keys.map(k=>'"'+String(o[k]||'').replace(/"/g,'""')+'"').join(','))].join('\n');downloadFile(`${t.name.replace(/[^a-z0-9]/gi,'_')}_${kind}.csv`,csv,'text/csv')}
function downloadTournament(id){let t=getTournament(id),data={tournament:t,teams:teamsFor(id),players:playersFor(id),matches:matchesFor(id)};downloadFile((t.name||'tournament').replace(/[^a-z0-9]/gi,'_')+'.json',JSON.stringify(data,null,2))}
function resetAll(){if(!loggedIn){toast('Admin login required');return}if(!confirm('Permanently remove all data stored in this browser?'))return;db=structuredClone(DEFAULT);saveDB();render();toast('Local data cleared')}
function openOverlayRoute(){let tid=new URLSearchParams(location.search).get('overlay');if(!tid)return false;let t=getTournament(tid),m=matchesFor(tid).find(x=>x.status==='Live')||matchesFor(tid)[0],a=m&&teamBy(m.teamA),b=m&&teamBy(m.teamB),s=m&&m.score||{A:{runs:0,wickets:0,balls:0},B:{runs:0,wickets:0,balls:0}};document.body.style.background='transparent';document.body.innerHTML=`<style>body{margin:0;background:transparent!important;font-family:Arial,sans-serif}.overlaypreview{border-radius:0;height:190px}.ovteam{width:25%}.ovscore strong{font-size:38px}.ovteam img{width:48px;height:48px}.ovbottom{font-size:13px}

</style><div class="overlaypreview"><div class="ovteam">${logoHtml(a&&a.logo,a&&a.name,'')}<div>${esc(a&&a.shortName||a&&a.name||'TEAM A')}</div><small>${esc(a&&a.name||'')}</small><b>${s.A?.runs||0}/${s.A?.wickets||0}</b></div><div class="ovscore"><div>${esc(t&&t.name||'SRI LANKA SOFTBALL')}</div><strong>${s[m&&m.batting||'A']?.runs||0}/${s[m&&m.batting||'A']?.wickets||0} · ${oversText(s[m&&m.batting||'A']?.balls||0)}</strong><div>${esc(m&&m.status||'MATCH')}</div><div class="ovbottom">${esc(m&&m.toss||'')} · ${esc(m&&m.venue||t&&t.place||'')}</div></div><div class="ovteam">${logoHtml(b&&b.logo,b&&b.name,'')}<div>${esc(b&&b.shortName||b&&b.name||'TEAM B')}</div><small>${esc(b&&b.name||'')}</small><b>${s.B?.runs||0}/${s.B?.wickets||0}</b></div></div>`;return true}
