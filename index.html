
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sri Lanka Softball</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071225;color:white;font-family:Arial,sans-serif;padding:16px}
header,.card{background:#112442;padding:18px;margin-bottom:15px;border-radius:14px;border:1px solid #29405e}
h1{color:#baf53c;font-size:25px}
button{background:#baf53c;color:#071225;border:0;padding:12px;border-radius:8px;font-weight:bold;margin:5px 3px;cursor:pointer}
input,select{padding:12px;border-radius:8px;background:#071225;color:white;border:1px solid #456080;max-width:100%}
.score{text-align:center;font-size:45px;font-weight:bold;color:#baf53c}
.team{padding:12px;background:#071a32;margin:8px 0;border-radius:8px}
</style>
</head>
<body>
<header>
<h1>🏏 SRI LANKA SOFTBALL</h1>
<p>Tournament Management & Live Score</p>
</header>

<section class="card">
<h2>Create Tournament</h2>
<input id="tournamentName" placeholder="Tournament name">
<br><br>
<select id="format">
<option>League</option>
<option>Knockout</option>
</select>
<button onclick="createTournament()">Create Tournament</button>
<div id="tournaments"></div>
</section>

<section class="card">
<h2>Teams</h2>
<input id="teamName" placeholder="Team name">
<button onclick="addTeam()">Add Team</button>
<div id="teams"></div>
</section>

<section class="card">
<h2>Live Score</h2>
<div class="score" id="score">0 - 0</div>
<p style="text-align:center" id="overs">Overs: 0.0</p>
<div style="text-align:center">
<button onclick="addRuns(0)">0</button>
<button onclick="addRuns(1)">1</button>
<button onclick="addRuns(2)">2</button>
<button onclick="addRuns(3)">3</button>
<button onclick="addRuns(4)">4</button>
<button onclick="addRuns(6)">6</button>
<button onclick="wicket()">WICKET</button>
<button onclick="undo()">UNDO</button>
</div>
</section>

<script>
let tournaments=JSON.parse(localStorage.getItem("sl_tournaments")||"[]");
let selected=localStorage.getItem("sl_selected")||"";
let runs=0,wickets=0,balls=0,history=[];

function save(){
 localStorage.setItem("sl_tournaments",JSON.stringify(tournaments));
 localStorage.setItem("sl_selected",selected);
}

function current(){
 return tournaments.find(t=>t.id===selected);
}

function createTournament(){
 let name=document.getElementById("tournamentName").value.trim();
 if(!name){alert("Enter tournament name");return;}
 tournaments.push({
  id:Date.now().toString(),
  name:name,
  format:document.getElementById("format").value,
  teams:[]
 });
 selected=tournaments[tournaments.length-1].id;
 save();
 render();
 document.getElementById("tournamentName").value="";
}

function addTeam(){
 let t=current();
 let name=document.getElementById("teamName").value.trim();
 if(!t){alert("Create a tournament first");return;}
 if(!name){alert("Enter team name");return;}
 t.teams.push(name);
 save();
 render();
 document.getElementById("teamName").value="";
}

function render(){
 document.getElementById("tournaments").innerHTML=
 tournaments.map(t=>`<div class="team">
 <b>${escapeHTML(t.name)}</b><br>
 ${escapeHTML(t.format)} · ${t.teams.length} teams<br>
 <button onclick="selectTournament('${t.id}')">Open</button>
 </div>`).join("");
 let t=current();
 document.getElementById("teams").innerHTML=t?
 t.teams.map(x=>`<div class="team">${escapeHTML(x)}</div>`).join(""):
 "Create and open a tournament first.";
}

function selectTournament(id){
 selected=id;save();render();
}

function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}

function updateScore(){
 document.getElementById("score").textContent=runs+" - "+wickets;
 document.getElementById("overs").textContent=
 "Overs: "+Math.floor(balls/6)+"."+(balls%6);
}

function addRuns(n){
 history.push({runs:runs,wickets:wickets,balls:balls});
 runs+=n;balls++;updateScore();
}

function wicket(){
 history.push({runs:runs,wickets:wickets,balls:balls});
 wickets++;balls++;updateScore();
}

function undo(){
 if(!history.length)return;
 let previous=history.pop();
 runs=previous.runs;
 wickets=previous.wickets;
 balls=previous.balls;
 updateScore();
}

render();
</script>
</body>
</html>
