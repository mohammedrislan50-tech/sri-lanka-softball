<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sri Lanka Softball</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#08111f;--panel:#122238;--line:#2b4059;--cyan:#00d8e8;--lime:#b9ff36;--white:#f6f8ff;--muted:#9eb0c7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:15px Arial,sans-serif}
header{background:#0c1a2c;border-bottom:2px solid var(--cyan);padding:18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:20px;color:var(--cyan);margin:0}h2{font-size:21px}h3{font-size:16px}
main{max-width:1100px;margin:auto;padding:15px}
button{background:var(--cyan);color:#06101b;border:0;border-radius:7px;padding:11px 13px;font-weight:bold;cursor:pointer;margin:3px}
.secondary{background:#293d55;color:white}.danger{background:#e34f5b;color:white}
input,select{width:100%;padding:11px;margin:5px 0 12px;background:#091525;color:white;border:1px solid #344a63;border-radius:6px}
label{display:block;color:#c7d7e9;font-size:13px}
.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:15px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
.muted{color:var(--muted);font-size:13px}.hidden{display:none!important}
.big{font-size:36px;color:var(--lime);font-weight:900}
nav{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}
.logo{width:55px;height:55px;object-fit:contain}
.player{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--line)}
.player img{width:40px;height:40px;object-fit:cover;border-radius:50%}
.scorebuttons{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.scorebuttons button{min-height:46px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}
th{color:var(--cyan)}
#notice{display:none;padding:10px;background:#17443c;color:#d5ffec;position:sticky;top:0;z-index:5}
.overlay{display:flex;background:#07122e;color:white;min-height:130px;overflow:hidden}
.ovteam{flex:1;padding:12px;display:flex;flex-direction:column;justify-content:center;font-weight:bold}
.ovcenter{min-width:190px;text-align:center;background:linear-gradient(110deg,#00ddeb,#00f5c8,#baff20);color:#07122e;padding:12px;clip-path:polygon(8% 0,92% 0,100% 15%,100% 85%,92% 100%,8% 100%,0 85%,0 15%)}
.ovscore{font-size:36px;font-weight:900}
@media(max-width:500px){.ovteam{font-size:11px;padding:6px}.ovcenter{min-width:120px;padding:8px}.ovscore{font-size:25px}}
</style>
</head>
<body>
<header>
<div><h1>🏏 SRI LANKA SOFTBALL</h1><div class="muted">Tournament Control Center</div></div>
<button class="secondary" onclick="signOut()">Logout</button>
</header>
<div id="notice"></div><main id="app">Loading...</main>
<script>
const SUPABASE_URL="PASTE_YOUR_PROJECT_URL";
const SUPABASE_KEY="PASTE_YOUR_PUBLISHABLE_KEY";
const configured=!SUPABASE_URL.startsWith("PASTE_")&&!SUPABASE_KEY.startsWith("PASTE_");
const sb=configured?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
let user=null,tournaments=[],tid=null,mid=null,page="home",groupPick="A",realtimeChannel=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const current=()=>tournaments.find(t=>t.id===tid);
const matches=()=>current()?.matches||[];
const match=()=>matches().find(m=>m.id===mid);
const teams=()=>current()?.teams||[];
const players=()=>current()?.players||[];
const team=id=>teams().find(t=>t.id===id);
const player=id=>players().find(p=>p.id===id);
const overText=m=>Math.floor((m.state?.balls||0)/(m.balls_per_over||6))+"."+((m.state?.balls||0)%(m.balls_per_over||6));
function notice(s){$("notice").textContent=s;$("notice").style.display="block";setTimeout(()=>$("notice").style.display="none",2800)}
function go(p){page=p;render()}
function nav(){return `<nav>
<button onclick="go('dashboard')">Dashboard</button><button onclick="go('teams')">Teams</button>
<button onclick="go('matches')">Edit Match</button><button onclick="go('table')">Table</button>
<button onclick="go('stats')">Stats</button><button onclick="go('info')">Info</button><button onclick="go('overlay')">Overlay</button>
</nav>`}
async function call(q){let {data,error}=await q;if(error)throw error;return data}
async function loadAll(){
if(!user)return;
try{
tournaments=await call(sb.from("tournaments").select("*").order("created_at",{ascending:false}));
if(!tid&&tournaments.length)tid=tournaments[0].id;
if(tid){
let t=current();
t.teams=await call(sb.from("teams").select("*").eq("tournament_id",tid));
t.players=await call(sb.from("players").select("*").eq("tournament_id",tid));
t.matches=await call(sb.from("matches").select("*").eq("tournament_id",tid).order("match_no"));
}
}catch(e){notice("Database error: "+e.message)}
}
function loginPage(){return `<h2>Admin Login</h2><div class="panel">
<p class="muted">Create an admin account or sign in.</p>
<label>Email</label><input id="email" type="email" autocomplete="email">
<label>Password</label><input id="password" type="password" autocomplete="current-password">
<button onclick="login()">Login</button><button class="secondary" onclick="signup()">Create Account</button>
</div><p class="muted">Supabase setup செய்யப்படவில்லை என்றால் முதலில் Project URL மற்றும் publishable key சேர்க்கவும்.</p>`}
async function login(){try{let r=await sb.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(r.error)throw r.error;user=r.data.user;await loadAll();go("home")}catch(e){notice(e.message)}}
async function signup(){try{let r=await sb.auth.signUp({email:$("email").value,password:$("password").value});if(r.error)throw r.error;notice("Account created. Email confirmation தேவைப்படலாம்.")}catch(e){notice(e.message)}}
async function signOut(){if(sb)await sb.auth.signOut();user=null;tournaments=[];render()}
async function uploadData(file){return new Promise((resolve,reject)=>{if(!file)return resolve(null);let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
function homePage(){return `<div class="row"><div><h2>My Tournaments</h2><p class="muted">Manage tournaments, teams and live matches.</p></div><button onclick="go('create')">＋ Create Tournament</button></div>
<div class="grid">${tournaments.map(t=>`<div class="card">${t.logo?`<img class="logo" src="${t.logo}">`:""}<h3>${esc(t.name)}</h3><p class="muted">${esc(t.format)} · ${(t.dates||[]).map(esc).join(", ")}</p><button onclick="openTournament('${t.id}')">Open</button></div>`).join("")||"<p>No tournaments yet.</p>"}</div>`}
async function openTournament(id){tid=id;await loadAll();go("dashboard")}
function createPage(){return `<h2>Create Tournament</h2><div class="panel">
<label>Tournament Name</label><input id="tname">
<label>Format</label><select id="format" onchange="$('groupFields').classList.toggle('hidden',this.value!=='League')"><option>League</option><option>Knockout</option></select>
<div id="groupFields"><label>Number of Groups</label><select id="ngroups">${[1,2,3,4,5,6,8].map(n=>`<option>${n}</option>`)}</select><label>Wickets per innings</label><input id="wkts" type="number" value="10" min="1"></div>
<label>Dates (comma separated YYYY-MM-DD)</label><input id="dates" placeholder="2026-10-20, 2026-10-21">
<label>Logo</label><input id="tlogo" type="file" accept="image/*">
<button onclick="createTournament()">Create Tournament</button></div>`}
async function createTournament(){try{
let name=$("tname").value.trim();if(!name)return notice("Enter tournament name");
let format=$("format").value,n=Number($("ngroups")?.value||1);
let logo=await uploadData($("tlogo").files[0]);
let data=await call(sb.from("tournaments").insert({owner_id:user.id,name,format,groups:format==="League"?Array.from({length:n},(_,i)=>String.fromCharCode(65+i)):[],dates:$("dates").value.split(",").map(x=>x.trim()).filter(Boolean),logo,wickets:Number($("wkts")?.value||10)}).select().single());
tid=data.id;await loadAll();go("dashboard");notice("Tournament created successfully");
}catch(e){notice(e.message)}}
function dashboard(){let t=current();return `<h2>${esc(t.name)}</h2><p class="muted">${esc(t.format)} · ${teams().length} teams · ${matches().length} matches</p>${nav()}<div class="grid"><div class="card"><h3>Teams</h3><div class="big">${teams().length}</div></div><div class="card"><h3>Matches</h3><div class="big">${matches().length}</div></div><div class="card"><h3>Live</h3><div class="big">${matches().filter(m=>m.status==="Live").length}</div></div></div><button onclick="go('teams')">Manage Teams</button><button onclick="go('newmatch')">＋ New Match</button>`}
function teamPage(){return `${nav()}<h2>Teams</h2><div class="panel"><label>Full Team Name</label><input id="teamName" oninput="$('shortName').value=this.value.trim().split(/\\s+/).map(w=>w[0]||'').join('').toUpperCase()"><label>Short Name</label><input id="shortName"><label>Group</label><select id="teamGroup">${(current().groups.length?current().groups:["A"]).map(g=>`<option>${esc(g)}</option>`).join("")}</select><label>Team Colour</label><input id="teamColor" type="color" value="#00d8e8"><label>Logo</label><input id="teamLogo" type="file" accept="image/*"><button onclick="addTeam()">Save Team</button><button class="secondary" onclick="importTeams()">Import CSV/Text</button><button class="secondary" onclick="exportTeams()">Export CSV</button></div>
${teams().map(t=>`<div class="card"><div class="row">${t.logo?`<img class="logo" src="${t.logo}">`:""}<div><b>${esc(t.name)}</b><div class="muted">${esc(t.short_name)} · Group ${esc(t.group_name)}</div></div><button onclick="editTeam('${t.id}')">Edit</button><button class="danger" onclick="deleteTeam('${t.id}')">Delete</button><button onclick="goPlayers('${t.id}')">Players</button></div></div>`).join("")}`}
async function addTeam(){try{let name=$("teamName").value.trim();if(!name)return notice("Enter team name");await call(sb.from("teams").insert({tournament_id:tid,owner_id:user.id,name,short_name:$("shortName").value.trim()||name.slice(0,3).toUpperCase(),group_name:$("teamGroup").value,color:$("teamColor").value,logo:await uploadData($("teamLogo").files[0])}));await loadAll();render();notice("Team saved")}catch(e){notice(e.message)}}
async function editTeam(id){let t=team(id),name=prompt("Team name",t.name);if(name===null)return;let short=prompt("Short name",t.short_name)||t.short_name;try{await call(sb.from("teams").update({name,short_name:short}).eq("id",id));await loadAll();render()}catch(e){notice(e.message)}}
async function deleteTeam(id){if(!confirm("Delete this team and its players?"))return;try{await call(sb.from("teams").delete().eq("id",id));await loadAll();render()}catch(e){notice(e.message)}}
function importTeams(){let text=prompt("Enter team names, one per line");if(!text)return;addTeamsBulk(text)}
async function addTeamsBulk(text){try{let rows=text.split(/\n/).map(x=>x.trim()).filter(Boolean).map(name=>({tournament_id:tid,owner_id:user.id,name,short_name:name.split(/\s+/).map(w=>w[0]).join("").toUpperCase(),group_name:current().groups[0]||"A",color:"#00d8e8"}));await call(sb.from("teams").insert(rows));await loadAll();render()}catch(e){notice(e.message)}}
function exportTeams(){let csv="Team,Short Name,Group\n"+teams().map(t=>[t.name,t.short_name,t.group_name].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="teams.csv";a.click()}
function goPlayers(id){selectedTeam=id;go("players")}
let selectedTeam=null;
function playersPage(){let t=team(selectedTeam);if(!t)return `${nav()}<p>Team not found.</p>`;return `${nav()}<h2>${esc(t.name)} Players</h2><div class="panel"><label>Player Name</label><input id="pname"><label>Photo</label><input id="pphoto" type="file" accept="image/*"><button onclick="addPlayer()">Save Player</button></div>${players().filter(p=>p.team_id===t.id).map(p=>`<div class="player">${p.photo?`<img src="${p.photo}">`:""}<b style="flex:1">${esc(p.name)}</b><button onclick="editPlayer('${p.id}')">Edit</button><button class="danger" onclick="deletePlayer('${p.id}')">Delete</button></div>`).join("")}`}
async function addPlayer(){try{let name=$("pname").value.trim();if(!name)return notice("Enter player name");await call(sb.from("players").insert({tournament_id:tid,team_id:selectedTeam,owner_id:user.id,name,photo:await uploadData($("pphoto").files[0])}));await loadAll();render()}catch(e){notice(e.message)}}
async function editPlayer(id){let p=player(id),name=prompt("Player name",p.name);if(name===null)return;try{await call(sb.from("players").update({name}).eq("id",id));await loadAll();render()}catch(e){notice(e.message)}}
async function deletePlayer(id){if(!confirm("Delete player?"))return;try{await call(sb.from("players").delete().eq("id",id));await loadAll();render()}catch(e){notice(e.message)}}
function matchesPage(){return `${nav()}<h2>Matches</h2><button onclick="go('newmatch')">＋ New Match</button>${matches().map(m=>`<div class="card"><b>Match ${m.match_no}</b><p>${esc(team(m.team_a)?.name||"?")} vs ${esc(team(m.team_b)?.name||"?")}</p><p class="muted">${esc(m.match_type)} · ${m.overs} overs · ${m.status}</p><button onclick="mid='${m.id}';go('toss')">Setup / Toss</button><button onclick="mid='${m.id}';go('score')">Live Score</button></div>`).join("")}`}
function newMatchPage(){return `${nav()}<h2>New Match Setup</h2><div class="panel"><label>Overs</label><input id="overs" type="number" value="20" min="1"><label>Balls per over</label><input id="bpo" type="number" value="6" min="1"><label>Match Type</label><select id="mtype">${["League Match","Knockout Match","1st Round","Quarter Final","Semi Final","Eliminator","1st Qualifier","2nd Qualifier","Final","Friendly"].map(x=>`<option>${x}</option>`).join("")}</select><label>Team A</label><select id="ta">${teams().map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select><label>Team B</label><select id="tb">${teams().map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select><button onclick="createMatch()">Next — Create Match</button></div>`}
async function createMatch(){try{if(teams().length<2)return notice("Add at least two teams");let a=$("ta").value,b=$("tb").value;if(a===b)return notice("Choose two different teams");let m=await call(sb.from("matches").insert({tournament_id:tid,owner_id:user.id,match_no:matches().length+1,team_a:a,team_b:b,match_type:$("mtype").value,overs:Number($("overs").value),balls_per_over:Number($("bpo").value),status:"Scheduled",state:{innings:1,runs:0,wickets:0,balls:0,batting:a,bowling:b,striker:null,non:null,bowler:null,toss:"",target:null,batters:{},bowlers:{},events:[],thisOver:[]}}).select().single());mid=m.id;await loadAll();go("toss")}catch(e){notice(e.message)}}
function tossPage(){let m=match();return `${nav()}<h2>Toss — Match ${m.match_no}</h2><div class="panel"><h3>${esc(team(m.team_a)?.name)} vs ${esc(team(m.team_b)?.name)}</h3><label>Toss winner</label><select id="tw"><option value="${m.team_a}">${esc(team(m.team_a)?.name)}</option><option value="${m.team_b}">${esc(team(m.team_b)?.name)}</option></select><label>Decision</label><select id="dec"><option value="bat">Elected to bat</option><option value="bowl">Elected to bowl</option></select><label>Striker</label><select id="striker">${playerOptions(m.team_a)}</select><label>Non-striker</label><select id="non">${playerOptions(m.team_a)}</select><label>Opening bowler</label><select id="bowler">${playerOptions(m.team_b)}</select><button onclick="startMatch()">Start Match</button></div>`}
function playerOptions(teamId){return players().filter(p=>p.team_id===teamId).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")||'<option value="">Add players first</option>'}
async function updateMatch(m){try{await call(sb.from("matches").update({state:m.state,status:m.status}).eq("id",m.id));await loadAll();render()}catch(e){notice(e.message)}}
async function startMatch(){let m=match(),s=m.state,w=$("tw").value,d=$("dec").value;s.toss=team(w).name+" elected to "+d;s.batting=(w===m.team_a?(d==="bat"?m.team_a:m.team_b):(d==="bat"?m.team_b:m.team_a));s.bowling=s.batting===m.team_a?m.team_b:m.team_a;s.striker=$("striker").value||null;s.non=$("non").value||null;s.bowler=$("bowler").value||null;m.status="Live";await updateMatch(m);notice("Match started")}
function batterStat(s,id){if(!s.batters[id])s.batters[id]={runs:0,balls:0,fours:0,sixes:0};return s.batters[id]}
function swapEnds(s){[s.striker,s.non]=[s.non,s.striker]}
function pushUndo(s){s.events.push(JSON.parse(JSON.stringify({...s,events:[]})))}
async function addBall(kind,value=0){let m=match(),s=m.state;if(!s.striker||!s.bowler)return notice("Select striker and bowler first");pushUndo(s);let legal=true,runs=value;
if(kind==="Wide"){runs=1;legal=false}
if(kind==="No-ball"){runs=1;legal=false}
if(kind==="Bye"||kind==="Leg-bye"){runs=value;let b=batterStat(s,s.striker);b.balls++;s.balls++}
else if(kind==="Penalty"){runs=5;legal=false}
else if(kind==="Wicket"){s.wickets++;s.balls++;s.thisOver.push("W");s.striker=null}
else if(kind==="Run"){let b=batterStat(s,s.striker);b.runs+=value;b.balls++;if(value===4)b.fours++;if(value===6)b.sixes++;s.balls++;s.thisOver.push(String(value));if(value%2)swapEnds(s)}
else{s.thisOver.push(kind==="Wide"?"Wd":kind==="No-ball"?"Nb":kind);if(legal)s.balls++}
s.runs+=runs;
if(kind==="Wide"||kind==="No-ball")s.thisOver.push(kind==="Wide"?"Wd":"Nb");
if(kind==="Penalty")s.thisOver.push("P");
if(s.balls%(m.balls_per_over||6)===0&&s.balls>0){s.thisOver=[];swapEnds(s);notice("Over completed — select next bowler")}
if(s.balls>=m.overs*m.balls_per_over)m.status="Innings complete";
await updateMatch(m)}
async function undoScore(){let m=match(),s=m.state;if(!s.events.length)return notice("Nothing to undo");let old=s.events.pop();old.events=s.events;m.state=old;await updateMatch(m)}
async function endInnings(){let m=match(),s=m.state;if(s.innings===1){s.target=s.runs+1;s.innings=2;[s.batting,s.bowling]=[s.bowling,s.batting];s.runs=0;s.wickets=0;s.balls=0;s.striker=null;s.non=null;s.bowler=null;s.thisOver=[];m.status="Scheduled";await updateMatch(m);go("toss")}else{m.status="Complete";await updateMatch(m)}}
function scorePage(){let m=match(),s=m.state||{},bat=team(s.batting),bowl=team(s.bowling),st=player(s.striker),ns=player(s.non),bo=player(s.bowler),bs=s.batters?.[s.striker]||{},nb=s.batters?.[s.non]||{};return `${nav()}<h2>LIVE SCORE · Match ${m.match_no}</h2><div class="panel"><div class="row"><div><b>${esc(bat?.name)}</b><div class="big">${s.runs||0}/${s.wickets||0}</div><div>${overText(m)} overs</div></div><div><b>${esc(bowl?.name)}</b><p>${m.overs} overs · ${esc(m.match_type)}</p><p class="muted">${esc(s.toss)}</p></div></div>
${s.innings===2?`<p>Target ${s.target||0} · Need ${Math.max(0,(s.target||0)-(s.runs||0))} runs</p>`:""}
<div class="grid"><div class="card"><b>Striker: ${esc(st?.name||"Not selected")}</b><p>${bs.runs||0} runs · ${bs.balls||0} balls · 4s ${bs.fours||0} · 6s ${bs.sixes||0}</p><label>Change striker</label><select id="ns1">${playerOptions(s.batting)}</select><button onclick="changePlayer('striker','ns1')">Update</button></div><div class="card"><b>Non-striker: ${esc(ns?.name||"Not selected")}</b><p>${nb.runs||0} runs · ${nb.balls||0} balls</p><label>Change non-striker</label><select id="ns2">${playerOptions(s.batting)}</select><button onclick="changePlayer('non','ns2')">Update</button></div><div class="card"><b>Bowler: ${esc(bo?.name||"Not selected")}</b><label>Change bowler</label><select id="ns3">${playerOptions(s.bowling)}</select><button onclick="changePlayer('bowler','ns3')">Update</button></div></div>
<h3>This Over: ${(s.thisOver||[]).map(esc).join(" · ")}</h3><div class="scorebuttons">${[0,1,2,3,4,5,6,7].map(n=>`<button onclick="addBall('Run',${n})">${n}</button>`).join("")}<button onclick="addBall('Wide')">Wide +1</button><button onclick="addBall('No-ball')">No-ball +1</button><button onclick="addBall('Bye',1)">Bye 1</button><button onclick="addBall('Leg-bye',1)">Leg-bye 1</button><button onclick="addBall('Penalty')">Penalty +5</button><button class="danger" onclick="addBall('Wicket')">OUT</button></div>
<div class="row"><button class="secondary" onclick="undoScore()">Undo</button><button class="secondary" onclick="endInnings()">End Innings</button><button class="danger" onclick="finishMatch()">End Match</button></div></div>`}
async function changePlayer(field,id){let m=match();m.state[field]=$(id).value||null;await updateMatch(m)}
async function finishMatch(){let m=match();m.status="Complete";await updateMatch(m);notice("Match completed")}
function tablePage(){let t=current();if(t.format!=="League")return `${nav()}<h2>Points Table</h2><p>Knockout tournament-க்கு points table தேவையில்லை.</p>`;return `${nav()}<h2>Points Table</h2><div class="row">${(t.groups||[]).map(g=>`<button class="secondary" onclick="groupPick='${g}';render()">Group ${g}</button>`).join("")}</div><h3>Group ${groupPick}</h3><table><tr><th>Team</th><th>P</th><th>W</th><th>L</th><th>Pts</th></tr>${teams().filter(t=>t.group_name===groupPick).map(tm=>{let ms=matches().filter(m=>m.status==="Complete"&&(m.team_a===tm.id||m.team_b===tm.id));let wins=ms.filter(m=>m.state?.winner===tm.id).length;return `<tr><td>${esc(tm.name)}</td><td>${ms.length}</td><td>${wins}</td><td>${ms.length-wins}</td><td>${wins*2}</td></tr>`}).join("")}</table>`}
function statsPage(){let list=[];matches().forEach(m=>Object.entries(m.state?.batters||{}).forEach(([id,s])=>list.push({name:player(id)?.name||"Player",...s})));return `${nav()}<h2>Batting Statistics</h2><table><tr><th>Player</th><th>Runs</th><th>Balls</th><th>4s</th><th>6s</th></tr>${list.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.runs}</td><td>${p.balls}</td><td>${p.fours}</td><td>${p.sixes}</td></tr>`).join("")}</table><h3>Bowling</h3><p class="muted">Bowling figures need a complete per-ball bowler log; this first version does not yet calculate economy, wickets or maidens.</p>`}
function infoPage(){let t=current();return `${nav()}<h2>Tournament Info</h2><div class="panel"><label>Name</label><input id="iname" value="${esc(t.name)}"><label>Dates</label><input id="idates" value="${esc((t.dates||[]).join(", "))}"><button onclick="saveInfo()">Update</button></div>`}
async function saveInfo(){try{await call(sb.from("tournaments").update({name:$("iname").value,dates:$("idates").value.split(",").map(x=>x.trim()).filter(Boolean)}).eq("id",tid));await loadAll();render();notice("Tournament updated")}catch(e){notice(e.message)}}
function overlayHTML(t){let m=t.matches?.find(x=>x.status==="Live")||t.matches?.[0];if(!m)return `<div class="overlay"><div class="ovteam">${esc(t.name)}</div><div class="ovcenter">NO MATCH</div></div>`;let s=m.state||{};return `<div class="overlay"><div class="ovteam">${esc(t.teams?.find(x=>x.id===s.batting)?.name||"TEAM A")}<br>${esc(t.players?.find(p=>p.id===s.striker)?.name||"Striker")}<br>${esc(t.players?.find(p=>p.id===s.non)?.name||"Non-striker")}</div><div class="ovcenter">${esc(m.match_type)}<div class="ovscore">${s.runs||0}-${s.wickets||0}</div>${Math.floor((s.balls||0)/m.balls_per_over)}.${(s.balls||0)%m.balls_per_over} OVERS<br>${esc(s.toss||"LIVE SCORE")}</div><div class="ovteam">${esc(t.teams?.find(x=>x.id===s.bowling)?.name||"TEAM B")}<br>${esc(t.players?.find(p=>p.id===s.bowler)?.name||"Bowler")}<br>${s.target?"Target "+s.target:""}</div></div>`}
function overlayPage(){let url=location.href.split("?")[0]+"?overlay="+tid;return `${nav()}<h2>OBS Overlay</h2><div class="panel">${overlayHTML({...current(),teams:teams(),players:players(),matches:matches()})}<label>OBS Browser Source URL</label><input id="ovurl" readonly value="${esc(url)}"><button onclick="copyLink()">Copy Overlay URL</button><p class="muted">OBS → Sources → + → Browser → URL paste செய்யவும். Canvas size 1920 × 1080 அமைக்கவும்.</p></div>`}
async function copyLink(){try{await navigator.clipboard.writeText($("ovurl").value);notice("Link copied")}catch(e){prompt("Copy this link",$("ovurl").value)}}
async function subscribeRealtime(){if(realtimeChannel)sb.removeChannel(realtimeChannel);realtimeChannel=sb.channel("matches-"+tid).on("postgres_changes",{event:"*",schema:"public",table:"matches",filter:"tournament_id=eq."+tid},async()=>{await loadAll();render()}).subscribe()}
async function render(){
if(!configured){$("app").innerHTML=`<h2>Connect Supabase</h2><div class="panel"><p>1. Create your Supabase project.</p><p>2. Run the database SQL provided.</p><p>3. In index.html replace <code>PASTE_YOUR_PROJECT_URL</code> and <code>PASTE_YOUR_PUBLISHABLE_KEY</code>.</p><p>4. Commit changes and reload.</p></div>`;return}
if(!user){let r=await sb.auth.getUser();user=r.data.user}
if(location.search.startsWith("?overlay=")){let id=new URLSearchParams(location.search).get("overlay");let t=await call(sb.from("tournaments").select("*").eq("id",id).single()).catch(()=>null);if(!t){$("app").innerHTML="Tournament not found";return}let ms=await call(sb.from("matches").select("*").eq("tournament_id",id).order("match_no")).catch(()=>[]);let ts=await call(sb.from("teams").select("*").eq("tournament_id",id)).catch(()=>[]);let ps=await call(sb.from("players").select("*").eq("tournament_id",id)).catch(()=>[]);$("app").innerHTML=overlayHTML({...t,matches:ms,teams:ts,players:ps});sb.channel("overlay-"+id).on("postgres_changes",{event:"*",schema:"public",table:"matches",filter:"tournament_id=eq."+id},()=>render()).subscribe();return}
if(!user){$("app").innerHTML=loginPage();return}
if(!tournaments.length){await loadAll()}
if(!tid&&tournaments.length)tid=tournaments[0].id;
let html;
if(page==="home")html=homePage();
else if(page==="create")html=createPage();
else if(!current())html=homePage();
else if(page==="dashboard")html=dashboard();
else if(page==="teams")html=teamPage();
else if(page==="players")html=playersPage();
else if(page==="matches")html=matchesPage();
else if(page==="newmatch")html=newMatchPage();
else if(page==="toss")html=tossPage();
else if(page==="score")html=scorePage();
else if(page==="table")html=tablePage();
else if(page==="stats")html=statsPage();
else if(page==="info")html=infoPage();
else if(page==="overlay")html=overlayPage();
else html=homePage();
$("app").innerHTML=html;
}
sb?.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;setTimeout(async()=>{if(user){await loadAll();if(tid)await subscribeRealtime()}render()},0)});
render();
</script>
</body>
